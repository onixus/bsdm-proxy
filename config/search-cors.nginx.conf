# =============================================================================
# BSDM Proxy — reverse-proxy для Search API (cache-indexer) с CORS.
#
# НАЗНАЧЕНИЕ
#   Пилотный сценарий: Admin Console на http://localhost:9090 обращается
#   XHR-запросами к Search API. Браузер требует CORS — этот конфиг терминирует
#   CORS и проксирует запросы на cache-indexer.
#
# КУДА КЛАСТЬ ФАЙЛ
#   Это ПОЛНЫЙ http-уровневый фрагмент (содержит `map`, `limit_req_zone`
#   и `server{}`), т.е. он кладётся туда, откуда nginx инклюдит файлы
#   ВНУТРИ блока http{} — в стоковой сборке это:
#       /etc/nginx/conf.d/search-cors.conf
#   (`include /etc/nginx/conf.d/*.conf;` находится внутри http{} в nginx.conf).
#
#   НЕ инклюдить этот файл внутрь существующего server{} — `map` и
#   `limit_req_zone` там недопустимы и nginx откажется стартовать.
#
#   Проверка после установки:
#       nginx -t && nginx -s reload
#
# ЧТО ОПЕРАТОР ОБЯЗАН ПОМЕНЯТЬ ПОД СЕБЯ (см. пометки CHANGE-ME ниже)
#   1. Список разрешённых Origin в map $http_origin $cors_origin.
#   2. Адрес апстрима в upstream bsdm_search_api.
#   3. Значения ssl_certificate/ssl_certificate_key, если включается TLS-блок.
#
# МОДЕЛЬ БЕЗОПАСНОСТИ
#   По умолчанию слушаем ТОЛЬКО loopback (127.0.0.1:80): запросы несут заголовок
#   Authorization с токеном Search API, и по plaintext HTTP наружу его выпускать
#   нельзя. Если доступ нужен НЕ с localhost — обязателен TLS, см. блок
#   «HTTPS-вариант» ниже; открывать `listen 80` на внешнем интерфейсе нельзя.
# =============================================================================

# -----------------------------------------------------------------------------
# http-уровень: whitelist Origin.
# Дефолт "" => заголовок Access-Control-Allow-Origin не отдаётся вовсе
# (nginx пропускает add_header с пустым значением переменной).
# Рефлексия произвольного $http_origin в связке с Allow-Credentials: true
# означала бы, что любой сайт в браузере оператора читает Search API от его имени.
# -----------------------------------------------------------------------------
map $http_origin $cors_origin {
    default                    "";
    # CHANGE-ME: перечислить реальные origin'ы админ-консоли. Схема+хост+порт,
    # точное совпадение, без завершающего слэша.
    "http://localhost:9090"    $http_origin;
    "http://127.0.0.1:9090"    $http_origin;
    # Раскомментировать, если админ-консоль работает по HTTPS:
    # "https://localhost:9090"  $http_origin;
    # "https://127.0.0.1:9090"  $http_origin;
}

# Credentials отдаём только вместе с разрешённым Origin.
map $cors_origin $cors_credentials {
    default  "true";
    ""       "";
}

# -----------------------------------------------------------------------------
# http-уровень: rate limiting.
# 10 r/s на IP, зона на 10 МБ (~160k адресов). Защищает cache-indexer от
# случайного цикла в UI и от перебора поисковых запросов.
# -----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=bsdm_search:10m rate=10r/s;
limit_req_status 429;

# -----------------------------------------------------------------------------
# http-уровень: апстрим.
# CHANGE-ME: адрес Search API.
#   - в docker-compose:      cache-indexer:8080
#   - при локальном пилоте:  127.0.0.1:18080
# -----------------------------------------------------------------------------
upstream bsdm_search_api {
    server cache-indexer:8080;
    keepalive 16;
}

# -----------------------------------------------------------------------------
# Catch-all: запросы с неизвестным Host (сканеры, DNS-rebinding, кривые прокси)
# обрываются без ответа.
# -----------------------------------------------------------------------------
server {
    listen 127.0.0.1:80 default_server;
    server_name _;

    server_tokens off;
    access_log /var/log/nginx/bsdm-search-cors.reject.log;
    error_log  /var/log/nginx/bsdm-search-cors.error.log warn;

    return 444;
}

server {
    listen 127.0.0.1:80;
    server_name localhost 127.0.0.1;

    # ---- Раскрытие информации ------------------------------------------------
    server_tokens off;
    proxy_hide_header Server;

    # ---- Логи ----------------------------------------------------------------
    access_log /var/log/nginx/bsdm-search-cors.access.log;
    error_log  /var/log/nginx/bsdm-search-cors.error.log warn;

    # ---- Лимиты запроса ------------------------------------------------------
    # Search API принимает небольшие JSON-запросы; 256k — с запасом.
    client_max_body_size        256k;
    client_body_buffer_size     16k;
    client_body_timeout         10s;
    client_header_timeout       10s;
    # 4x4k, не 2x1k: CORS здесь credentialed (Allow-Credentials: true), поэтому
    # браузер шлёт Cookie вместе с Authorization, а поисковые запросы несут
    # длинные query-параметры. При 1k такой запрос отбивается с 400/414.
    # 16k суммарно всё равно вдвое меньше дефолтных 4x8k.
    large_client_header_buffers 4 4k;
    keepalive_timeout           10s;
    send_timeout                10s;

    # ---- Ограничение методов -------------------------------------------------
    if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$) {
        return 405;
    }

    location / {
        limit_req zone=bsdm_search burst=20 nodelay;

        # ВНИМАНИЕ (семантика nginx): add_header во вложенном контексте
        # ОТМЕНЯЕТ наследование add_header из внешнего контекста. Поэтому
        # полный набор заголовков продублирован и в preflight-ветке, и ниже.
        # Любая правка одного списка должна повторяться во втором.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials $cors_credentials always;
            add_header Access-Control-Allow-Methods     "GET, POST, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept" always;
            add_header Access-Control-Max-Age           86400 always;
            add_header Vary                             "Origin" always;

            add_header X-Frame-Options                  "DENY" always;
            add_header X-Content-Type-Options            "nosniff" always;
            add_header Content-Security-Policy           "default-src 'none'; frame-ancestors 'none'" always;
            add_header Referrer-Policy                   "no-referrer" always;

            add_header Content-Type                      "text/plain" always;
            return 204;
        }

        proxy_pass http://bsdm_search_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        # Цепочка XFF формируется nginx'ом; заголовок от клиента не принимается
        # «как есть» — апстрим не должен доверять подставленному клиентом IP.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Схему выставляем явно, перетирая всё, что прислал клиент.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Authorization     $http_authorization;

        # Таймауты к апстриму: зависший cache-indexer не должен держать
        # воркеры дефолтные 60s.
        proxy_connect_timeout 3s;
        proxy_send_timeout    10s;
        proxy_read_timeout    30s;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials $cors_credentials always;
        add_header Access-Control-Expose-Headers    "Content-Type" always;
        add_header Vary                             "Origin" always;

        add_header X-Frame-Options                  "DENY" always;
        add_header X-Content-Type-Options            "nosniff" always;
        add_header Content-Security-Policy           "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy                   "no-referrer" always;
    }
}

