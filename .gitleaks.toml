# Конфигурация gitleaks. Стандартный набор правил расширяется, а не заменяется.
#
# Зачем файл вообще появился: воркспейс Jenkins вычитывает из репозитория все
# рефы, а gitleaks обходит историю целиком. Поэтому находка на любой ветке
# роняет стадию Secrets у всех остальных, включая main. Fingerprint из
# .gitleaksignore для такого не годится — он привязан к SHA коммита, и любая
# перестройка ветки делает запись мёртвой, после чего стадия падает снова.
# Исключение по пути и содержимому от SHA не зависит.
[extend]
useDefault = true

[[allowlists]]
description = """
Тест разбора приватного ключа Apple (.p8) в proxy/src/oidc.rs. Правило
private-key срабатывает на саму PEM-обёртку; тело блока — "AQID", то есть три
байта 1,2,3, и проверяется ровно то, что парсер обёртку срезает. Ключевого
материала в файле нет. Условие AND: и путь, и содержимое — настоящая утечка в
этом же файле не будет заглушена.
"""
condition = "AND"
paths = ['''proxy/src/oidc\.rs''']
regexes = ['''BEGIN PRIVATE KEY-----\\nAQID\\n-----END PRIVATE KEY''']
