name: Setup Rust Environment
description: Install system deps, Rust toolchain, and enable Cargo cache

inputs:
  components:
    description: "Comma-separated Rust components to install (e.g. rustfmt,clippy)"
    required: false
    default: ""
  toolchain:
    description: "Rust toolchain (dtolnay/rust-toolchain is pinned by SHA, so it cannot infer it from the ref)"
    required: false
    default: "stable"
  cache-key:
    description: "Extra rust-cache key so jobs with different build profiles (clippy/test/features) do not evict each other"
    required: false
    default: ""
  system-deps:
    description: "Install apt build dependencies (librdkafka, protoc, ...). Set to 'false' for jobs that do not compile (fmt)."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install system dependencies
      if: inputs.system-deps == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          libssl-dev \
          pkg-config \
          cmake \
          librdkafka-dev \
          libclang-dev \
          protobuf-compiler

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    # Cache is only *written* from main: PR runs restore it but never save, so a
    # pull request cannot poison the cache that later main/tag builds restore,
    # and the 10 GB repo cache quota is not burnt on short-lived branches.
    - name: Cache Cargo dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
