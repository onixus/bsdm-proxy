name: Setup Rust Environment
description: Install system deps, Rust toolchain, and enable Cargo cache

inputs:
  components:
    description: "Comma-separated Rust components to install (e.g. rustfmt,clippy)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          libssl-dev \
          pkg-config \
          cmake \
          librdkafka-dev \
          libclang-dev \
          protobuf-compiler

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        components: ${{ inputs.components }}

    - name: Cache Cargo dependencies
      uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
