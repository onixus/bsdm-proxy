name: One-shot fix v0.9.11 lockfile

on:
  push:
    branches:
      - release/v0.9.11-hardening

permissions:
  contents: write

jobs:
  fix-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.9.11-hardening
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust

      - name: Refresh lockfile using release feature profiles
        run: |
          cargo check --no-default-features --features auth-basic -p bsdm-proxy
          cargo check --no-default-features -p cache-indexer

      - name: Validate locked release profiles
        run: |
          cargo check --locked --no-default-features --features auth-basic -p bsdm-proxy
          cargo check --locked --no-default-features -p cache-indexer
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --quiet && { echo "Cargo.lock already current"; exit 0; }
          git commit -m "fix(release): refresh Cargo.lock for v0.9.11"
          git push origin HEAD:release/v0.9.11-hardening
