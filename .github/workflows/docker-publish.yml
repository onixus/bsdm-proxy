name: Docker Publish GHCR

# Release images: ghcr.io/onixus/bsdm-{proxy,cache-indexer,alert-worker,
# ml-worker,dns-sinkhole,threat-intel}, linux/amd64 + linux/arm64.
#
# Triggered by a release tag (v*). Per image, in this order:
#   1. build linux/amd64 locally and run the Trivy gate (CRITICAL/HIGH with an
#      available fix fail the job) — a vulnerable image is never pushed;
#   2. build + push the multi-arch image with BuildKit SBOM + max provenance
#      attestations;
#   3. sign the pushed digest with cosign keyless (GitHub OIDC → Fulcio,
#      recorded in Rekor) and attach an SPDX SBOM (syft) as a signed
#      cosign attestation; the SBOM is also uploaded as a workflow artifact.
#
# Verify a published image:
#   cosign verify ghcr.io/onixus/bsdm-proxy:<version> \
#     --certificate-identity-regexp '^https://github.com/onixus/bsdm-proxy/\.github/workflows/docker-publish\.yml@refs/tags/v.*$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   cosign verify-attestation --type spdxjson <same flags> ghcr.io/onixus/bsdm-proxy:<version>
#
# Degradation / prerequisites (documented, not silent):
#   * No repository secrets are needed: GHCR login and keyless signing use the
#     job's GITHUB_TOKEN / OIDC token. The workflow is skipped on forks
#     (repository_owner guard), so a fork can never push or sign as onixus.
#   * If the Trivy DB cannot be downloaded the gate FAILS (fail-closed); re-run
#     the job. Exceptions go to .github/trivy/trivyignore with a reason.
#   * Jenkinsfile.publish is the fallback publisher when Actions minutes are
#     exhausted; it runs the same Trivy gate and signs only when a cosign key
#     credential is configured (see that file).
#   * arm64 is built under QEMU and dominates the run time (timeout 180 min).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag for a manual build (e.g. edge). Letters, digits, . _ - only."
        required: false
        default: ""

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Trivy DB mirrors: mirror.gcr.io first (no ghcr.io rate limits), ghcr.io as
  # fallback.
  TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2

jobs:
  build-and-push:
    if: github.repository_owner == 'onixus' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write       # cosign keyless (Fulcio OIDC)
      attestations: write   # BuildKit provenance/SBOM attestations
    strategy:
      fail-fast: false
      matrix:
        # One image per Dockerfile stage, named as charts/bsdm/values.yaml and
        # docker-compose.yml expect them (ghcr.io/onixus/bsdm-<target>).
        target: [proxy, cache-indexer, alert-worker, ml-worker, dns-sinkhole, threat-intel]
    steps:
      # Inputs/refs reach the shell only through env, never through ${{ }}
      # inside the script (script-injection hardening).
      - name: Validate publish context
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "ref=${GITHUB_REF} ref_type=${GITHUB_REF_TYPE} sha=${GITHUB_SHA}"
          if [[ -n "${INPUT_TAG}" && ! "${INPUT_TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::invalid image tag input"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bsdm-${{ matrix.target }}
          # latest=auto: `latest` only for a non-prerelease semver tag, so
          # v1.0.0-rc.1 never moves `latest`.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=long,enable=${{ github.event_name == 'workflow_dispatch' }}

      # ---- 1. Gate: scan before anything is pushed --------------------------
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: bsdm-scan/${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=bsdm-${{ matrix.target }}
          cache-to: type=gha,scope=bsdm-${{ matrix.target }},mode=max,ignore-error=true

      - name: Trivy gate (CRITICAL/HIGH, fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: bsdm-scan/${{ matrix.target }}:${{ github.sha }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .github/trivy/trivyignore

      # ---- 2. Publish -----------------------------------------------------
      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bsdm-${{ matrix.target }}
          cache-to: type=gha,scope=bsdm-${{ matrix.target }},mode=max,ignore-error=true
          sbom: true
          provenance: mode=max

      # ---- 3. Sign + SBOM attestation ---------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate SPDX SBOM (syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bsdm-${{ matrix.target }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.target }}.spdx.json
          artifact-name: sbom-${{ matrix.target }}.spdx.json
          upload-release-assets: false

      - name: Sign image and attest SBOM (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bsdm-${{ matrix.target }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SBOM: sbom-${{ matrix.target }}.spdx.json
        run: |
          set -euo pipefail
          # Sign the immutable digest, never a mutable tag.
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate "${SBOM}" "${IMAGE}@${DIGEST}"
          echo "### ${IMAGE}@${DIGEST} signed (keyless) + SBOM attested" >> "$GITHUB_STEP_SUMMARY"
