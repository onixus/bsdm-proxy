name: Documentation

on:
  pull_request:
    paths:
      - "*.md"
      - "**/*.md"
      - "deploy/compose/docker-compose.pilot.yml"
      - "docs/**"
      - "scripts/check-doc-links.py"
      - "scripts/sync-wiki.py"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "*.md"
      - "**/*.md"
      - "deploy/compose/docker-compose.pilot.yml"
      - "docs/**"
      - "scripts/check-doc-links.py"
      - "scripts/sync-wiki.py"
      - ".github/workflows/docs.yml"

# Read-only by default: the link check runs on pull requests (including from
# forks) and must not get a writable token. Only the Wiki publisher, which runs
# on push to main, is granted contents: write.
permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Check local Markdown links
        run: python3 scripts/check-doc-links.py
      - name: Validate Wiki catalog and generated links
        run: python3 scripts/sync-wiki.py --validate

  wiki:
    if: github.event_name == 'push'
    needs: links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Checkout Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            wiki
      - name: Generate Wiki
        run: python3 scripts/sync-wiki.py wiki
      - name: Verify generated Wiki is current
        run: python3 scripts/sync-wiki.py wiki --check
      - name: Publish Wiki changes
        working-directory: wiki
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Wiki is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "docs: sync from repository"
          git push origin HEAD:master
