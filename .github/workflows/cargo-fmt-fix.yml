name: One-shot cargo fmt repair

on:
  push:
    branches:
      - fix/cargo-fmt

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/cargo-fmt
          fetch-depth: 0

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply cargo fmt and remove workflow
        run: |
          cargo fmt --all
          rm .github/workflows/cargo-fmt-fix.yml

      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(rust): apply cargo fmt formatting"
          git push origin HEAD:fix/cargo-fmt
