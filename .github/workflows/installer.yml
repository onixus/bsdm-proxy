name: Installer Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  installer:
    name: Validate installer scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          bash -n install.sh
          bash -n scripts/interactive-install.sh
          find scripts/installer -name '*.sh' -print0 | xargs -0 -n1 bash -n

      # scandir '.' covers every script in the repo, not just the installer, so
      # the severity threshold matters: at shellcheck's default the action fails
      # on info/style notes (SC1091 "not following" sourced files, SC2012, SC2016)
      # that are spread across long-standing benchmark and ops scripts. Without a
      # threshold this job can never pass, which is how it landed — it has failed
      # on every run since it was added. Gate on genuine errors instead.
      #
      # Raising this to 'warning' is the natural next step; it needs the four
      # existing SC2034/SC2155 findings fixed first (restore-clickhouse.sh,
      # ci/run-load-tests.sh, ci/run.sh).
      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          severity: error

      - name: Installer sanity
        run: tests/install/test-installer-sanity.sh
