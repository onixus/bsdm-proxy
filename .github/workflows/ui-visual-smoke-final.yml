name: One-shot UI visual smoke final

on:
  push:
    branches:
      - agent/ui-refactor-admin-console

permissions:
  contents: write

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin-console

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-refactor-admin-console
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-console/package-lock.json

      - name: Install, test, lint and build
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/admin-console-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/admin/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/admin-console-preview.log
          exit 1

      - name: Validate and capture real routes
        run: |
          mkdir -p ui-smoke-final
          cat > ui-smoke-final-runner.mjs <<'EOF'
          import { chromium } from 'playwright'
          import { writeFile } from 'node:fs/promises'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } })
          const pageErrors = []
          const results = []
          page.on('pageerror', (error) => pageErrors.push(error.message))
          await page.addInitScript(() => localStorage.setItem('bsdm-admin-demo-mode', 'true'))

          for (const [name, route] of [
            ['dashboard', '/admin/'],
            ['logs', '/admin/logs'],
            ['analytics', '/admin/analytics'],
            ['settings-security', '/admin/settings?tab=security'],
          ]) {
            const response = await page.goto(`http://127.0.0.1:4173${route}`, { waitUntil: 'networkidle' })
            await page.waitForTimeout(1000)
            const body = await page.locator('body').innerText()
            const invalid = body.includes('public base URL of /admin/') || body.trim().length < 100
            results.push({ name, route, status: response?.status(), invalid, title: await page.title() })
            await page.screenshot({ path: `ui-smoke-final/${name}.png`, fullPage: true })
            if (invalid) throw new Error(`Invalid rendered page for ${route}`)
          }

          await writeFile('ui-smoke-final/browser-report.json', JSON.stringify({ results, pageErrors }, null, 2))
          await browser.close()
          if (pageErrors.length > 0) process.exitCode = 1
          EOF
          node ./ui-smoke-final-runner.mjs
          rm ui-smoke-final-runner.mjs

      - name: Upload verified screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-console-ui-screenshots-verified
          path: |
            admin-console/ui-smoke-final
            /tmp/admin-console-preview.log
          if-no-files-found: error
          retention-days: 7

      - name: Remove one-shot workflow
        if: always()
        working-directory: .
        run: |
          rm -f .github/workflows/ui-visual-smoke-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci(admin-console): remove final visual smoke workflow"
            git push origin HEAD:agent/ui-refactor-admin-console
          fi
