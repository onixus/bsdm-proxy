name: Performance & Load Testing

on:
  push:
    branches: [main]
    paths:
      - 'proxy/**'
      - 'scripts/run-load-test.sh'
      - 'scripts/run-hybrid-load-test.sh'
      - 'scripts/ci/**'
      - 'scripts/wrk-proxy.lua'
      - 'docker-compose.lite.yml'
      - '.github/workflows/load-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'proxy/**'
      - 'scripts/run-load-test.sh'
      - 'scripts/run-hybrid-load-test.sh'
      - 'scripts/ci/**'
      - 'scripts/wrk-proxy.lua'
      - 'docker-compose.lite.yml'
      - '.github/workflows/load-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Run wrk Load Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install wrk
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wrk curl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run lite and hybrid load-test profiles
        env:
          RESULTS_DIR: /tmp/hybrid-load-results
        run: ./scripts/ci/run.sh load-test

      - name: Upload hybrid load-test result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-load-test-result
          path: /tmp/hybrid-load-results
          if-no-files-found: ignore
          retention-days: 7
