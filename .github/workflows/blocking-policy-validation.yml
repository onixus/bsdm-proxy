name: Blocking Policy Validation

on:
  push:
    branches:
      - perf/blocking-policy-hot-path

permissions:
  contents: write

jobs:
  validate:
    name: Format and policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt

      - name: Format changed Rust files
        run: |
          cargo fmt --all
          git add proxy/src/policy_engine.rs proxy/src/threat_score_cache.rs
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "style(policy): apply rustfmt"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Run blocking policy tests
        run: |
          cargo test -p bsdm-proxy --lib policy_engine
          cargo test -p bsdm-proxy --lib threat_score_cache
