name: One-shot prepare v0.9.11

on:
  push:
    branches:
      - release/v0.9.11-hardening

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.9.11-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-console/package-lock.json

      - uses: ./.github/actions/setup-rust

      - name: Prepare release content
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = '0.9.10'
          new = '0.9.11'
          manifests = [
              'proxy/Cargo.toml',
              'bsdm-events/Cargo.toml',
              'cache-indexer/Cargo.toml',
              'alert-worker/Cargo.toml',
              'ml-worker/Cargo.toml',
              'dns-sinkhole/Cargo.toml',
          ]
          for name in manifests:
              path = Path(name)
              text = path.read_text()
              old_line = f'version = "{old}"'
              new_line = f'version = "{new}"'
              if new_line in text:
                  continue
              if old_line not in text:
                  raise SystemExit(f'{name}: version is neither {old} nor {new}')
              path.write_text(text.replace(old_line, new_line, 1))

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          if '## [0.9.11] - 2026-08-06' not in text:
              start = text.index('## [Unreleased]')
              end = text.index('## [0.9.10]')
              release = '''## [Unreleased]\n\n## [0.9.11] - 2026-08-06\n\nPatch after **0.9.10**: Admin Console foundations, fixture-backed browser\nsmoke testing, control-plane/RPZ integration, and release pipeline hardening.\n\n### Added\n\n- **Fixture-backed Admin Console smoke test** — production build is driven by\n  Chromium over all supported and frozen routes without Kafka, ClickHouse, the\n  proxy data-plane, or the ML worker. CI rejects console errors, failed requests,\n  demo-data fallback, missing fixture markers, and broken SPA navigation.\n- **Same-origin Search proxy** — control plane proxies `GET /api/search*` and\n  `POST /api/events` to `SEARCH_UPSTREAM_URL`.\n- **RPZ management API** — file-backed `/api/dns/rpz/*`, sinkhole configuration,\n  zone compilation, and live dns-sinkhole reload support.\n- **Product agent binary** — `bsdm-agent` is the preferred product binary name.\n\n### Changed\n\n- **Admin Console foundations** — shared design tokens, reusable surfaces,\n  command palette navigation, decomposed Dashboard, Logs, Analytics, and Settings,\n  URL-synchronised tabs, consistent focus handling, and reduced-motion support.\n- **Release validation** — manifest, lockfile, changelog, Rust, Admin Console,\n  browser smoke, package checksum, SBOM, and provenance checks are release gates.\n\n### Fixed\n\n- **Settings Apply safety** — sends a delta against live configuration, does not\n  persist masked secrets, and confirms sensitive path changes.\n- **RPZ startup inside Tokio** — avoids blocking-lock use on the active runtime.\n- **Mock static path boundary** — prevents sibling-prefix and `..` traversal.\n- **Generated RPZ state** — runtime zone output is no longer tracked by Git.\n- **Admin Console Docker build** — exposes the product version from the manifest.\n\n'''
              changelog.write_text(text[:start] + release + text[end:])

          Path('docs/releases/v0.9.11.md').write_text('''# BSDM-Proxy v0.9.11\n\n**Release date:** 2026-08-06  \n**Type:** patch release  \n**Previous release:** v0.9.10\n\n## Highlights\n\n- Refactored Admin Console foundations and modular Settings UI.\n- Fixture-backed Chromium smoke test across every console route.\n- Same-origin Search integration and file-backed RPZ management.\n- Safer live configuration Apply semantics.\n- Package checksums, GHCR SBOM, provenance, and stronger release validation.\n\n## Upgrade\n\n1. Pull or build the `v0.9.11` images or packages.\n2. Preserve `/etc/bsdm-proxy`, `/certs`, and persistent data volumes.\n3. Do not restore generated RPZ state from source control.\n4. Verify `/health`, `/ready`, and `/admin/` on port `9090`.\n5. Validate archive downloads with the adjacent `.sha256` file.\n\nNo intentional breaking control-plane API changes.\n''')

          Path('packaging/README.md').write_text('''# BSDM-Proxy release package\n\nThe package version is derived from `proxy/Cargo.toml`; operational procedures\nshould not hardcode a stale version.\n\n## Contents\n\n| Path | Description |\n|------|-------------|\n| `bin/proxy` | HTTPS caching proxy and control plane |\n| `bin/cache-indexer` | Kafka to ClickHouse indexer |\n| `bin/alert-worker` | ClickHouse to SIEM/webhook alerts |\n| `bin/ml-worker` | Feature and ML score worker |\n| `bin/dns-sinkhole` | RPZ DNS sinkhole sidecar |\n| `config/*.example` | Environment and ACL templates |\n| `systemd/` | systemd unit files |\n| `install.sh` | Installer script |\n| `VERSION` | Package version string |\n| `SHA256SUMS` | Checksums for packaged binaries |\n\nThe release publishes `<archive>.sha256` beside every tarball.\n\n## Quick start\n\n```bash\nVERSION=0.9.11\nARCH=x86_64\nsha256sum -c bsdm-proxy-${VERSION}-linux-${ARCH}.tar.gz.sha256\ntar xzf bsdm-proxy-${VERSION}-linux-${ARCH}.tar.gz\ncd bsdm-proxy-${VERSION}-linux-${ARCH}\nsudo ./install.sh --create-user --systemd\n```\n\n## Verify\n\n```bash\ncurl --fail http://127.0.0.1:9090/health\ncurl --fail http://127.0.0.1:9090/ready\ncurl --fail http://127.0.0.1:9090/admin/ >/dev/null\ncat VERSION\n```\n\nDefault ports: proxy `3128`, control/metrics `9090`, cache-indexer `8080`,\nalert-worker `8090`, ML worker `8091`, DNS sinkhole metrics `8092`.\n''')

          build = Path('scripts/build-package.sh')
          text = build.read_text()
          checksum = 'sha256sum "$(basename "$TARBALL")" >"$(basename "$TARBALL").sha256"'
          if checksum not in text:
              old_block = 'tar -C "${ROOT}/dist" -czf "$TARBALL" "$PACKAGE_NAME"\n\necho "==> Package ready"'
              new_block = '''tar -C "${ROOT}/dist" -czf "$TARBALL" "$PACKAGE_NAME"\n(\n  cd "${ROOT}/dist"\n  sha256sum "$(basename "$TARBALL")" >"$(basename "$TARBALL").sha256"\n)\n\necho "==> Package ready"'''
              if old_block not in text:
                  raise SystemExit('build-package tar block not found')
              build.write_text(text.replace(old_block, new_block, 1))
          PY

      - name: Refresh lockfile and validate
        run: |
          cargo metadata --no-deps --format-version 1 >/dev/null
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo fmt --all -- --check
          grep -q '^## \[0.9.11\]' CHANGELOG.md

      - name: Validate Admin Console
        working-directory: admin-console
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Commit release content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock CHANGELOG.md \
            proxy/Cargo.toml bsdm-events/Cargo.toml cache-indexer/Cargo.toml \
            alert-worker/Cargo.toml ml-worker/Cargo.toml dns-sinkhole/Cargo.toml \
            docs/releases/v0.9.11.md packaging/README.md scripts/build-package.sh
          git commit -m "release: prepare BSDM-Proxy v0.9.11"
          git push origin HEAD:release/v0.9.11-hardening
