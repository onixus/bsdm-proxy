name: One-shot UI visual smoke retry

on:
  push:
    branches:
      - agent/ui-refactor-admin-console

permissions:
  contents: write

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin-console

    steps:
      - name: Checkout UI branch
        uses: actions/checkout@v4
        with:
          ref: agent/ui-refactor-admin-console
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-console/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Install Chromium runner
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/admin-console-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/admin-console-preview.log
          exit 1

      - name: Capture UI
        run: |
          mkdir -p ui-smoke
          cat > ui-smoke-runner.mjs <<'EOF'
          import { chromium } from 'playwright'
          import { writeFile } from 'node:fs/promises'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 })
          const consoleErrors = []
          const pageErrors = []
          page.on('console', (message) => {
            if (message.type() === 'error') consoleErrors.push(message.text())
          })
          page.on('pageerror', (error) => pageErrors.push(error.message))
          await page.addInitScript(() => localStorage.setItem('bsdm-admin-demo-mode', 'true'))

          for (const [name, path] of [
            ['dashboard', '/'],
            ['logs', '/logs'],
            ['analytics', '/analytics'],
            ['settings-security', '/settings?tab=security'],
          ]) {
            await page.goto(`http://127.0.0.1:4173${path}`, { waitUntil: 'networkidle' })
            await page.waitForTimeout(1000)
            await page.screenshot({ path: `ui-smoke/${name}.png`, fullPage: true })
          }

          await writeFile('ui-smoke/browser-report.json', JSON.stringify({ consoleErrors, pageErrors }, null, 2))
          await browser.close()
          if (pageErrors.length > 0) process.exitCode = 1
          EOF
          node ./ui-smoke-runner.mjs
          rm ui-smoke-runner.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-console-ui-screenshots
          path: |
            admin-console/ui-smoke
            /tmp/admin-console-preview.log
          if-no-files-found: error
          retention-days: 7

      - name: Remove one-shot workflow
        if: always()
        working-directory: .
        run: |
          rm -f .github/workflows/ui-visual-smoke-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci(admin-console): remove visual smoke retry workflow"
            git push origin HEAD:agent/ui-refactor-admin-console
          fi
