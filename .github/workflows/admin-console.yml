name: Admin Console CI

on:
  push:
    branches: [main]
    paths:
      - 'admin-console/**'
      - 'scripts/ci/**'
      - '.github/workflows/admin-console.yml'
  pull_request:
    branches: [main]
    paths:
      - 'admin-console/**'
      - 'scripts/ci/**'
      - '.github/workflows/admin-console.yml'

concurrency:
  group: admin-console-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-console/package-lock.json

      - name: Lint, test, and build
        run: ./scripts/ci/run.sh admin-console-core

  ui-smoke:
    name: Local UI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-console/package-lock.json

      - name: Build and drive the console against the fixture backend
        run: ./scripts/ci/run.sh admin-console-ui
        env:
          UI_TEST_SCREENSHOTS: '1'
          PLAYWRIGHT_INSTALL_DEPS: '1'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-console-screenshots
          path: admin-console/test/local/screenshots
          if-no-files-found: ignore
          retention-days: 7
