name: CI

# ОТКЛЮЧЕНО: заменено локальным Jenkins (Jenkinsfile, джоба bsdm-proxy).
# Причина — лимиты минут GitHub Actions. Автоматические триггеры сняты, чтобы
# не жечь минуты; ручной запуск оставлен на случай, если понадобится сверка.
# Вернуть: раскомментировать push/pull_request ниже.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Format, Lint, Build, Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Run CA rotation drill
        run: ./scripts/ci/run.sh rust-ca

      - name: Setup Rust environment
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt,clippy

      - name: Check formatting
        run: ./scripts/ci/run.sh rust-fmt

      - name: Run clippy
        run: ./scripts/ci/run.sh rust-clippy

      - name: Build workspace
        run: ./scripts/ci/run.sh rust-build

      - name: Build lite profile (no rdkafka)
        run: ./scripts/ci/run.sh rust-lite

      - name: Run tests (unit + e2e + smoke)
        run: ./scripts/ci/run.sh rust-test

      - name: Build and test gRPC control plane feature
        run: ./scripts/ci/run.sh rust-grpc

      - name: Build and test Wasm plugin host feature
        run: ./scripts/ci/run.sh rust-wasm

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Run cargo-audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
