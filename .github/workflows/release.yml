name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build packages only (no GitHub Release)"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate before release
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Show release context
        run: |
          echo "ref=${GITHUB_REF}"
          echo "ref_name=${GITHUB_REF_NAME}"
          echo "ref_type=${GITHUB_REF_TYPE}"
          git rev-parse HEAD

      - name: Setup Rust environment
        uses: ./.github/actions/setup-rust

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-console/package-lock.json

      - name: Validate release metadata
        shell: bash
        env:
          CI_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/ci/run.sh release-validate

      - name: Check formatting
        run: ./scripts/ci/run.sh rust-fmt

      - name: Run clippy
        run: ./scripts/ci/run.sh rust-clippy

      - name: Run Rust tests
        run: ./scripts/ci/run.sh rust-test

      - name: Validate Admin Console
        env:
          PLAYWRIGHT_INSTALL_DEPS: '1'
        run: ./scripts/ci/run.sh admin-console

  build:
    name: Build package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - run: ./scripts/ci/run.sh package
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: bsdm-proxy-package-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bsdm-proxy-package-*
          merge-multiple: true
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x scripts/extract-release-notes.sh
          ./scripts/extract-release-notes.sh "$VERSION" > dist/RELEASE_NOTES.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BSDM-Proxy ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
