# Pinned so the project name stays 'bsdm-proxy' regardless of the checkout
# directory name (Compose derives it from the directory otherwise).
name: bsdm-proxy

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.8
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bsdm-net
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 2048
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
        reservations:
          memory: 256M

  kafka:
    image: confluentinc/cp-kafka:7.9.8
    depends_on:
      - zookeeper
    # Control plane / not data plane: broker is reachable inside bsdm-net.
    # PLAINTEXT listener stays on loopback on the host.
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    networks:
      - bsdm-net
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 2048
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G
        reservations:
          memory: 512M

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    # No password is configured for the default user: never publish beyond loopback.
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: bsdm
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./scripts/clickhouse/http_cache.sql:/docker-entrypoint-initdb.d/01-http_cache.sql:ro
      - ./scripts/clickhouse/ml_features.sql:/docker-entrypoint-initdb.d/02-ml_features.sql:ro
    networks:
      - bsdm-net
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The official entrypoint starts as root, chowns /var/lib/clickhouse and
    # then drops to the clickhouse user — that needs exactly these five.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 2048
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G
        reservations:
          memory: 1G

  proxy:
    image: ghcr.io/onixus/bsdm-proxy:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: proxy
      cache_from:
        - type=registry,ref=ghcr.io/onixus/bsdm-proxy:latest
    ports:
      # 3128 is the data plane (clients) — published on all interfaces.
      - "3128:3128"
      # 9090 is metrics + control/admin API — loopback only.
      - "127.0.0.1:9090:9090"
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=cache-events
      - CACHE_CAPACITY=10000
      - CACHE_TTL_SECONDS=3600
      - MAX_CACHE_BODY_SIZE=10485760
      # Body spill must land on a volume, not the (read-only) container rootfs
      # or the small /tmp tmpfs. Same path the pilot overlay uses.
      - CACHE_SPILL_DIR=/var/cache/bsdm-spill
      - HTTP_PORT=3128
      - METRICS_PORT=9090
      - DEPLOYMENT_PROFILE=production
      - POLICY_MODE=selective-mitm
      - MITM_CATEGORIES=malware,phishing,illegal-content
      - PINNING_EXCEPTIONS_PATH=/etc/bsdm-proxy/pinning-exceptions.json
      - PINNING_AUDIT_LOG_PATH=/var/log/bsdm-proxy/pinning-audit.jsonl
      # Agent Phase C device inventory (survives restart); empty path = memory-only
      - AGENT_DEVICES_PATH=${AGENT_DEVICES_PATH:-/var/lib/bsdm-proxy/agent-devices.json}
      - MITM_ENABLED=true
      - AUTH_ENABLED=false
      - SHUTDOWN_TIMEOUT_SECONDS=30
      - ACL_ENABLED=false
      - ACL_DEFAULT_ACTION=allow
      - ACL_RULES_PATH=/etc/bsdm-proxy/acl-rules.json
      - ACL_AUTO_RELOAD=false
      # Writable env persist (Admin Settings Apply); not cwd /
      - CONFIG_ENV_PATH=/var/lib/bsdm-proxy/bsdm-proxy.env
      # Same-origin Search for Admin Console on :9090
      - SEARCH_UPSTREAM_URL=http://cache-indexer:8080
      # RPZ API state + compiled zone shared with dns-sinkhole
      - DNS_RPZ_STATE_DIR=/var/lib/bsdm-proxy/rpz
      - DNS_SINKHOLE_ZONE_PATH=/var/lib/bsdm-proxy/rpz/compiled.rpz
      - DNS_SINKHOLE_RELOAD_URL=http://dns-sinkhole:8092/api/zone/reload
      - CATEGORIZATION_ENABLED=false
      - UT1_ENABLED=false
      # Control plane: set real secrets for pilot. Lab compose allows insecure open APIs.
      - CONTROL_API_TOKEN=${CONTROL_API_TOKEN:-}
      - ACL_API_TOKEN=${ACL_API_TOKEN:-}
      - CONTROL_API_ALLOW_INSECURE=${CONTROL_API_ALLOW_INSECURE:-true}
      - METRICS_BIND=${METRICS_BIND:-0.0.0.0}
      - DLP_ENABLED=${DLP_ENABLED:-false}
      - THREAT_SCORE_ENABLED=${THREAT_SCORE_ENABLED:-false}
      - THREAT_SCORE_POLL_URL=${THREAT_SCORE_POLL_URL:-http://ml-worker:8091/api/threat-scores}
      - THREAT_SCORE_POLL_INTERVAL_SECS=${THREAT_SCORE_POLL_INTERVAL_SECS:-60}
      # Threat-intel Shadow Mode: observe-only IOC matching (issue #330).
      - TI_SHADOW_MATCH_ENABLED=${TI_SHADOW_MATCH_ENABLED:-true}
      - TI_SHADOW_FEED_PATH=/var/lib/bsdm-proxy/threat-intel/threat_domains.json.shadow
      - UT1_PATH=/var/lib/ut1-blacklists
      - RUST_LOG=info,bsdm_proxy=debug
      - RUST_BACKTRACE=1
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - bsdm-net
    volumes:
      - ./certs:/certs:ro
      # Writable /etc/bsdm-proxy (ACL persist needs sibling *.tmp)
      - ./config/bsdm-etc:/etc/bsdm-proxy
      - pinning-audit:/var/log/bsdm-proxy
      - agent-devices:/var/lib/bsdm-proxy
      - proxy-spill:/var/cache/bsdm-spill
      # Shadow-mode IOC export, read-only: observation, never enforcement.
      - threat-intel-data:/var/lib/bsdm-proxy/threat-intel:ro
    tty: true
    stdin_open: true
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Runs as uid 1000; every writable path is a volume above.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 512M
        reservations:
          memory: 256M

  cache-indexer:
    build:
      context: .
      dockerfile: Dockerfile
      target: cache-indexer
      cache_from:
        - type=registry,ref=ghcr.io/onixus/bsdm-proxy:cache-indexer
    # Search API carries a bearer token: loopback only, front it with TLS.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=cache-events
      - KAFKA_GROUP_ID=cache-indexer-group
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_DATABASE=bsdm
      - CLICKHOUSE_TABLE=http_cache
      - METRICS_PORT=8080
      - SEARCH_API_ENABLED=true
      - SEARCH_API_TOKEN=${SEARCH_API_TOKEN:-}
      - SEARCH_API_ALLOW_INSECURE=${SEARCH_API_ALLOW_INSECURE:-true}
      - DEPLOYMENT_PROFILE=${DEPLOYMENT_PROFILE:-production}
      - RUST_LOG=info,cache_indexer=debug
      - RUST_BACKTRACE=1
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - bsdm-net
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ClickHouse-backed here: no local state (SQLite path is Lite-only).
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 256M

  alert-worker:
    profiles: ["alerts"]
    build:
      context: .
      dockerfile: Dockerfile
      target: alert-worker
      cache_from:
        - type=registry,ref=ghcr.io/onixus/bsdm-proxy:alert-worker
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_WEBHOOK_HEADERS=${ALERT_WEBHOOK_HEADERS:-{}}
      - ALERT_POLL_INTERVAL_SECS=${ALERT_POLL_INTERVAL_SECS:-60}
      - ALERT_LOOKBACK_SECS=${ALERT_LOOKBACK_SECS:-300}
      - ALERT_DEDUPE_TTL_SECS=${ALERT_DEDUPE_TTL_SECS:-3600}
      - ALERT_RULES=${ALERT_RULES:-blocked_burst,domain_burst,off_hours_threat,high_entropy_domain,beacon_periodic}
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_DATABASE=bsdm
      - CLICKHOUSE_TABLE=http_cache
      - METRICS_PORT=8090
      - RUST_LOG=info,alert_worker=info
    depends_on:
      clickhouse:
        condition: service_healthy
      cache-indexer:
        condition: service_started
    networks:
      - bsdm-net
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8090/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 256M

  ml-worker:
    profiles: ["ml"]
    build:
      context: .
      dockerfile: Dockerfile
      target: ml-worker
      cache_from:
        - type=registry,ref=ghcr.io/onixus/bsdm-proxy:ml-worker
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_DATABASE=bsdm
      - CLICKHOUSE_TABLE=http_cache
      - ML_FEATURES_TABLE=entity_features
      - ML_SCORES_TABLE=ml_scores
      - ML_PHISHING_FEATURES_TABLE=domain_phishing_features
      - ML_BEACON_FEATURES_TABLE=beacon_pair_features
      - ML_SCORE_CACHE_TABLE=threat_score_cache
      - ML_WRITEBACK_ENABLED=${ML_WRITEBACK_ENABLED:-true}
      - ML_WRITEBACK_MIN_SCORE=${ML_WRITEBACK_MIN_SCORE:-0.5}
      - ML_WRITEBACK_TTL_SECS=${ML_WRITEBACK_TTL_SECS:-3600}
      - ML_POLL_INTERVAL_SECS=${ML_POLL_INTERVAL_SECS:-120}
      - ML_LOOKBACK_SECS=${ML_LOOKBACK_SECS:-300}
      - ML_ENTITY_TYPES=${ML_ENTITY_TYPES:-client_ip}
      - ML_MIN_REQUESTS=${ML_MIN_REQUESTS:-10}
      - ML_MODEL=${ML_MODEL:-ueba_zscore_v0}
      - ML_SCORE_THRESHOLD=${ML_SCORE_THRESHOLD:-0.8}
      - ML_BASELINE_LOOKBACK_SECS=${ML_BASELINE_LOOKBACK_SECS:-86400}
      - ML_BASELINE_MIN_SAMPLES=${ML_BASELINE_MIN_SAMPLES:-30}
      - ML_ZSCORE_CLIP=${ML_ZSCORE_CLIP:-4.0}
      - ML_BASELINE_PATH=${ML_BASELINE_PATH:-}
      - ML_WEBHOOK_URL=${ML_WEBHOOK_URL:-}
      - METRICS_PORT=8091
      - RUST_LOG=info,ml_worker=info
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - bsdm-net
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ML_BASELINE_PATH is unset by default; point it at a volume before
    # setting it, otherwise the write fails on the read-only rootfs.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8091/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 256M

  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    networks:
      - bsdm-net
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9093/-/healthy || exit 1"]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
        reservations:
          memory: 128M

  prometheus:
    image: prom/prometheus:v3.12.0
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      # --web.enable-lifecycle is intentionally NOT set: it exposes unauthenticated
      # POST /-/reload and /-/quit. Reload via `docker compose kill -s HUP prometheus`.
    networks:
      - bsdm-net
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    depends_on:
      - proxy
      - alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 256M

  grafana:
    image: grafana/grafana:12.3.8
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # No default: compose refuses to start rather than shipping admin/admin.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD to a strong value}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-clickhouse-datasource
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_UNIFIED_ALERTING_ENABLED=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/alerting:/etc/grafana/provisioning/alerting:ro
    networks:
      - bsdm-net
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    depends_on:
      - prometheus
      - clickhouse
      - alertmanager
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 256M

  icap:
    profiles: ["icap"]
    # Upstream repository name is 'calmav' (sic) and ships a single tag.
    image: toolarium/toolarium-icap-calmav-docker:0.0.1
    ports:
      - "127.0.0.1:1344:1344"
    networks:
      - bsdm-net
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # c-icap/clamd start as root and drop to the clamav user at startup.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    pids_limit: 512
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 512M

  # Hybrid first hop (Core). UDP :5353 on host → :53 in container.
  # Day-1 pilot: UDP only (DoH/DoT off unless TLS certs provided).
  dns-sinkhole:
    build:
      context: .
      dockerfile: Dockerfile
      target: dns-sinkhole
      cache_from:
        - type=registry,ref=ghcr.io/onixus/bsdm-proxy:dns-sinkhole
    ports:
      # 5353/udp is the data plane (resolver clients).
      - "5353:53/udp"
      # 8092 is metrics + zone-reload API — loopback only.
      - "127.0.0.1:8092:8092"
    environment:
      - DNS_SINKHOLE_ENABLED=${DNS_SINKHOLE_ENABLED:-true}
      - DNS_SINKHOLE_BIND=0.0.0.0:53
      - DNS_SINKHOLE_UPSTREAM=${DNS_SINKHOLE_UPSTREAM:-1.1.1.1:53}
      - DNS_SINKHOLE_ZONE_PATH=${DNS_SINKHOLE_ZONE_PATH:-/var/lib/bsdm-proxy/rpz/compiled.rpz}
      - DNS_ZONE_HOST=${DNS_ZONE_HOST:-./examples/dns/blocklist.rpz}
      - DNS_SINKHOLE_ACTION=${DNS_SINKHOLE_ACTION:-sinkhole}
      - DNS_SINKHOLE_A=${DNS_SINKHOLE_A:-127.0.0.1}
      - DNS_SINKHOLE_DOH_ENABLED=${DNS_SINKHOLE_DOH_ENABLED:-false}
      - DNS_SINKHOLE_DOT_ENABLED=${DNS_SINKHOLE_DOT_ENABLED:-false}
      - DNS_SINKHOLE_TLS_CERT=${DNS_SINKHOLE_TLS_CERT:-}
      - DNS_SINKHOLE_TLS_KEY=${DNS_SINKHOLE_TLS_KEY:-}
      - METRICS_PORT=8092
      - RUST_LOG=info,dns_sinkhole=info
    volumes:
      - agent-devices:/var/lib/bsdm-proxy
      - ${DNS_ZONE_HOST:-./examples/dns/blocklist.rpz}:/etc/bsdm-proxy/blocklist.rpz:ro
    networks:
      - bsdm-net
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Binds :53 (and :853 with DoT) inside the container as uid 1000.
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8092/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 128M

  # IOC feed collector (TASK-TI-001). Opt-in: `--profile threat-intel`.
  # Needs egress to the configured feeds; writes snapshots to a local volume
  # for the IOC store and the scoring engine.
  threat-intel:
    profiles: ["threat-intel"]
    build:
      context: .
      dockerfile: Dockerfile
      target: threat-intel
      cache_from:
        - type=registry,ref=ghcr.io/onixus/bsdm-proxy:threat-intel
    # Admin/SOAR API is reachable only inside the compose network. Publish it
    # deliberately (and only with TI_API_TOKEN set) if an operator needs it.
    expose:
      - "8093"
    environment:
      - TI_SOURCES=${TI_SOURCES:-openphish,phishstats,phishing_database,urlhaus}
      - TI_POLL_INTERVAL_SECS=${TI_POLL_INTERVAL_SECS:-900}
      - TI_HTTP_TIMEOUT_SECS=${TI_HTTP_TIMEOUT_SECS:-30}
      - TI_MAX_ATTEMPTS=${TI_MAX_ATTEMPTS:-3}
      - TI_RETRY_BACKOFF_SECS=${TI_RETRY_BACKOFF_SECS:-5}
      - TI_MAX_BODY_MB=${TI_MAX_BODY_MB:-64}
      - TI_MAX_INDICATORS_PER_FETCH=${TI_MAX_INDICATORS_PER_FETCH:-500000}
      - TI_OUTPUT_DIR=/var/lib/bsdm-proxy/threat-intel
      # Fail-safe default (issue #330): shadow writes *.shadow artifacts only.
      - TI_ENFORCEMENT_MODE=${TI_ENFORCEMENT_MODE:-shadow}
      # Compose-network bind so Prometheus can scrape /metrics; the port is not
      # published to the host. Mutating SOAR endpoints stay fail-closed until
      # TI_API_TOKEN is set.
      - TI_ADMIN_BIND=${TI_ADMIN_BIND:-0.0.0.0}
      - TI_API_TOKEN=${TI_API_TOKEN:-}
      - METRICS_PORT=8093
      - RUST_LOG=info,threat_intel=info
    volumes:
      - threat-intel-data:/var/lib/bsdm-proxy/threat-intel
    networks:
      - bsdm-net
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Snapshots (and their *.tmp siblings) go to the volume above.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8093/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 128M

networks:
  bsdm-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  clickhouse-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
  pinning-audit:
    driver: local
  agent-devices:
    driver: local
  proxy-spill:
    driver: local
  threat-intel-data:
    driver: local
