# Pilot overlay for Hybrid Policy path (issues #269 / #270).
#
# Usage:
#   export CONTROL_API_TOKEN ACL_API_TOKEN SEARCH_API_TOKEN  # required secrets
#   ./scripts/gen-ca.sh
#   docker compose -f docker-compose.yml -f docker-compose.pilot.yml up -d --build
#
# Hybrid defaults only. Experimental modules stay behind compose profiles
# (alerts, ml, icap, experimental-trust-ui) and are NOT enabled by this file.
#
# Docs: docs/getting-started/pilot-deployment.md
#       docs/ops-and-dev/load-test-selective-mitm.md

services:
  zookeeper:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M

  kafka:
    environment:
      KAFKA_LOG_RETENTION_HOURS: "48"
    deploy:
      resources:
        limits:
          cpus: "1.25"
          memory: 2560M

  clickhouse:
    volumes:
      - ./scripts/clickhouse/pilot_retention.sql:/docker-entrypoint-initdb.d/03-pilot-retention.sql:ro
    deploy:
      resources:
        limits:
          cpus: "3.00"
          memory: 6G

  proxy:
    environment:
      # --- Hybrid Policy (Phase B pilot) ---
      DEPLOYMENT_PROFILE: production
      POLICY_MODE: selective-mitm
      MITM_ENABLED: "true"
      MITM_CATEGORIES: malware,phishing,illegal-content
      # full-mitm is rejected in production unless ALLOW_FULL_MITM=true (do not set)
      PINNING_EXCEPTIONS_PATH: /etc/bsdm-proxy/pinning-exceptions.json
      PINNING_AUDIT_LOG_PATH: /var/log/bsdm-proxy/pinning-audit.jsonl

      # --- Core controls ---
      ACL_ENABLED: "${ACL_ENABLED:-true}"
      ACL_DEFAULT_ACTION: "${ACL_DEFAULT_ACTION:-allow}"
      AUTH_ENABLED: "${AUTH_ENABLED:-false}"
      CATEGORIZATION_ENABLED: "${CATEGORIZATION_ENABLED:-false}"
      UT1_ENABLED: "${UT1_ENABLED:-false}"

      # --- Capacity (100-user functional pilot) ---
      WORKER_COUNT: "2"
      CACHE_CAPACITY: "20000"
      CACHE_SHARDS: "16"
      CACHE_TTL_SECONDS: "3600"
      CACHE_SPILL_THRESHOLD_BYTES: "262144"
      CACHE_SPILL_DIR: /var/cache/bsdm-spill
      CACHE_COMPRESSION: zstd
      MAX_CACHE_BODY_SIZE: "4194304"
      KAFKA_SAMPLE_RATE: "0"
      METRICS_SAMPLE_RATE: "10"
      PERF_FAST_CACHE_HIT: "false"
      STREAMING_MISS_ENABLED: "true"

      # --- Tokens (required for pilot; never commit real values) ---
      CONTROL_API_TOKEN: "${CONTROL_API_TOKEN:?set CONTROL_API_TOKEN}"
      ACL_API_TOKEN: "${ACL_API_TOKEN:?set ACL_API_TOKEN}"
      # Explicit: pilot must not open mutating APIs without tokens.
      CONTROL_API_ALLOW_INSECURE: "false"
      METRICS_BIND: "${METRICS_BIND:-0.0.0.0}"
      # Optional Prometheus scrape Bearer (or METRICS_REQUIRE_AUTH=true to reuse CONTROL_API_TOKEN)
      METRICS_AUTH_TOKEN: "${METRICS_AUTH_TOKEN:-}"
      # Experimental DLP off for pilot day-1 (persistent kill-switch; no control-API wipe needed).
      DLP_ENABLED: "false"
    volumes:
      - pilot-spill:/var/cache/bsdm-spill
    deploy:
      resources:
        limits:
          cpus: "4.00"
          memory: 4G

  cache-indexer:
    environment:
      SEARCH_API_DEFAULT_DAYS: "5"
      SEARCH_API_TOKEN: "${SEARCH_API_TOKEN:?set SEARCH_API_TOKEN}"
      INGEST_API_TOKEN: "${INGEST_API_TOKEN:-}"
      SEARCH_API_ALLOW_INSECURE: "false"
      DEPLOYMENT_PROFILE: production
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # Resource caps only for optional profiles — still opt-in via --profile
  alert-worker:
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  ml-worker:
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  alertmanager:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M

  prometheus:
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=5d"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1536M

  grafana:
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G

volumes:
  pilot-spill:
