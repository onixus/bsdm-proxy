# Pinned so the project name stays 'bsdm-proxy' now that this file lives
# outside the repo root (Compose would otherwise derive it from the directory).
name: bsdm-proxy

# LAB STACK — NOT FOR PRODUCTION.
# Deliberately permissive: AUTH_ENABLED=false, ACL_ENABLED=false on both proxy
# instances, so the HA/failover sketch needs no credentials. Reference defaults
# live in bsdm-proxy.env / docker-compose.yml.

# HA sketch: 2 proxy instances + Redis L2 behind implicit round-robin.
# No k8s required — validates L2-HIT across restarts before Helm deploy.
#
# Usage:
#   docker compose -f deploy/compose/docker-compose.ha.yml up -d --build
#   curl -x http://127.0.0.1:3128 http://upstream/get          # MISS via proxy-a
#   docker compose -f deploy/compose/docker-compose.ha.yml restart proxy-a
#   curl -x http://127.0.0.1:3128 http://upstream/get          # L2-HIT on proxy-b path
#
# k8s equivalent: docs/ops-and-dev/k8s-architecture.md, charts/bsdm/

services:
  redis:
    image: redis:7.4-alpine
    networks:
      - ha-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Official entrypoint starts as root, chowns /data and drops to `redis`.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          pids: 512
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  upstream:
    image: kennethreitz/httpbin:latest
    networks:
      - ha-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # gunicorn in this image listens on :80 inside the container.
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          pids: 512
          cpus: "0.50"
          memory: 256M

  proxy-a:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: proxy
    ports:
      - "3128:3128"
    environment:
      - HTTP_PORT=3128
      - METRICS_PORT=9090
      - MITM_ENABLED=false
      - WORKER_COUNT=1
      - CACHE_SHARDS=16
      - CACHE_CAPACITY=5000
      - CACHE_SPILL_DIR=/var/cache/bsdm-spill
      - CACHE_SPILL_THRESHOLD_BYTES=262144
      - REDIS_L2_ENABLED=true
      - REDIS_URL=redis://redis:6379
      - AUTH_ENABLED=false
      - ACL_ENABLED=false
      - CATEGORIZATION_ENABLED=false
      - RUST_LOG=info,bsdm_proxy=info
    volumes:
      - spill-a:/var/cache/bsdm-spill
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Cache spill is the only writable path and it is a volume above.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    deploy:
      resources:
        limits:
          pids: 512
          cpus: "2.00"
          memory: 1G
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ha-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/health | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy-b:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: proxy
    environment:
      - HTTP_PORT=3128
      - METRICS_PORT=9090
      - MITM_ENABLED=false
      - WORKER_COUNT=1
      - CACHE_SHARDS=16
      - CACHE_CAPACITY=5000
      - CACHE_SPILL_DIR=/var/cache/bsdm-spill
      - CACHE_SPILL_THRESHOLD_BYTES=262144
      - REDIS_L2_ENABLED=true
      - REDIS_URL=redis://redis:6379
      - AUTH_ENABLED=false
      - ACL_ENABLED=false
      - CATEGORIZATION_ENABLED=false
      - RUST_LOG=info,bsdm_proxy=info
    volumes:
      - spill-b:/var/cache/bsdm-spill
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Cache spill is the only writable path and it is a volume above.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    deploy:
      resources:
        limits:
          pids: 512
          cpus: "2.00"
          memory: 1G
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ha-net

  # Simulates second endpoint — in prod use LB across proxy replicas.
  # Only proxy-a is exposed; restart proxy-a to demo L2 recovery via shared Redis.

networks:
  ha-net:
    driver: bridge

volumes:
  spill-a:
  spill-b:
