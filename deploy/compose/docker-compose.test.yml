# Pinned so the project name stays 'bsdm-proxy' now that this file lives
# outside the repo root (Compose would otherwise derive it from the directory).
name: bsdm-proxy

# Minimal stack for manual / Docker-based smoke and E2E runs.
#
# Usage:
#   docker compose -f deploy/compose/docker-compose.test.yml up -d --build
#   ../../scripts/run-smoke-tests.sh --external
#   ../../scripts/run-e2e-tests.sh --external   # cache HIT for HTTPS may fail (MITM_ENABLED=false)
#   docker compose -f deploy/compose/docker-compose.test.yml down
#
# See docs/getting-started/deployment.md for details.

services:
  upstream:
    image: kennethreitz/httpbin:latest
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # gunicorn in this image listens on :80 inside the container.
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          pids: 512
          cpus: "0.50"
          memory: 256M
  proxy:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: proxy
    ports:
      - "3128:3128"
      - "9090:9090"
    environment:
      - HTTP_PORT=3128
      - METRICS_PORT=9090
      - MITM_ENABLED=false
      - AUTH_ENABLED=false
      - ACL_ENABLED=false
      - CATEGORIZATION_ENABLED=false
      - RUST_LOG=warn
    volumes:
      - ../../certs:/certs:ro
      - ../../config/acl-rules.test.json:/etc/bsdm-proxy/acl-rules.json:ro
    depends_on:
      - upstream
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Spill uses the default /tmp/bsdm-cache-spill (tmpfs below).
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    deploy:
      resources:
        limits:
          pids: 512
          cpus: "1.00"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/health | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 10
