# Pinned so the project name stays 'bsdm-proxy' now that this file lives
# outside the repo root (Compose would otherwise derive it from the directory).
name: bsdm-proxy

# LAB / CI STACK — NOT FOR PRODUCTION.
# Deliberately permissive: AUTH_ENABLED=false, ACL_ENABLED=false,
# ACL_DEFAULT_ACTION=allow, CONTROL_API_ALLOW_INSECURE=true,
# SEARCH_API_ALLOW_INSECURE=true. The control and search APIs are open to
# anyone who can reach the port. This profile exists for zero-config demos and
# CI load tests; use docker-compose.yml + deploy/compose/docker-compose.pilot.yml
# for anything real.

# Zero-config Lite profile: caching HTTPS proxy + optional SQLite search.
# No Kafka / ClickHouse / Prometheus / Grafana.
#
# Usage:
#   ../../scripts/gen-ca.sh
#   docker compose -f deploy/compose/docker-compose.lite.yml up -d --build
#   curl --cacert certs/ca.crt -x http://127.0.0.1:3128 https://httpbin.org/get
#   curl 'http://127.0.0.1:8080/api/search?limit=5'
#
# Docs: docs/getting-started/lite-mode.md · docs/roadmap.md

services:
  cache-indexer:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: cache-indexer
      args:
        LITE_BUILD: "1"
    ports:
      - "8080:8080"
    environment:
      - INDEX_STORE=sqlite
      - SQLITE_PATH=/var/lib/cache-indexer/events.db
      - SQLITE_MAX_ROWS=1000000
      - METRICS_PORT=8080
      - SEARCH_API_ENABLED=true
      - SEARCH_API_ALLOW_INSECURE=true
      - DEPLOYMENT_PROFILE=production
      # KAFKA_BROKERS / CLICKHOUSE_* intentionally unset
      - RUST_LOG=info,cache_indexer=info
    volumes:
      - lite-indexer:/var/lib/cache-indexer
    networks:
      - bsdm-lite
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # SQLite index lives on the lite-indexer volume; nothing else is written.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          pids: 512
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 128M

  proxy:
    image: ghcr.io/onixus/bsdm-proxy:latest
    build:
      context: ../..
      dockerfile: Dockerfile
      target: proxy
      args:
        LITE_BUILD: "1"
    ports:
      - "3128:3128"
      - "9090:9090"
      - "18080:18080"
    environment:
      - HTTP_PORT=3128
      - METRICS_PORT=9090
      - DEPLOYMENT_PROFILE=production
      - POLICY_MODE=selective-mitm
      - MITM_CATEGORIES=malware,phishing,illegal-content
      - PINNING_EXCEPTIONS_PATH=/etc/bsdm-proxy/pinning-exceptions.json
      - PINNING_AUDIT_LOG_PATH=/var/log/bsdm-proxy/pinning-audit.jsonl
      - MITM_ENABLED=true
      - AUTH_ENABLED=false
      - ACL_ENABLED=false
      - ACL_DEFAULT_ACTION=allow
      - CATEGORIZATION_ENABLED=false
      # Lab defaults — set CONTROL_API_TOKEN and CONTROL_API_ALLOW_INSECURE=false for pilot.
      - CONTROL_API_ALLOW_INSECURE=true
      - METRICS_BIND=0.0.0.0
      - DLP_ENABLED=false
      - CACHE_CAPACITY=5000
      - CACHE_TTL_SECONDS=3600
      - MAX_CACHE_BODY_SIZE=10485760
      - CACHE_SPILL_DIR=/var/cache/bsdm-spill
      - CACHE_SPILL_THRESHOLD_BYTES=65536
      - SHUTDOWN_TIMEOUT_SECONDS=30
      - EVENT_SINK_URL=http://cache-indexer:8080/api/events
      # Kafka intentionally unset — HTTP sink to SQLite indexer
      - RUST_LOG=info,bsdm_proxy=info
      - RUST_BACKTRACE=0
    volumes:
      - ../../certs:/certs:ro
      - ../../config/pinning-exceptions.example.json:/etc/bsdm-proxy/pinning-exceptions.json:ro
      - lite-pinning-audit:/var/log/bsdm-proxy
      - lite-spill:/var/cache/bsdm-spill
    depends_on:
      cache-indexer:
        condition: service_healthy
    networks:
      - bsdm-lite
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Writable paths (pinning audit, cache spill) are volumes above.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          pids: 512
          cpus: "2.00"
          memory: 1G
        reservations:
          memory: 256M

  # Mock upstream for scripts/run-load-test.sh (load-test.yml CI workflow).
  # Shares the proxy container's network namespace so a single loopback
  # address (127.0.0.1:18080) is reachable both from the CI runner host
  # (via the proxy service's published port) and from inside the proxy
  # process itself when it forwards requests to the upstream.
  mock-upstream:
    image: python:3.12-slim
    network_mode: "service:proxy"
    depends_on:
      proxy:
        condition: service_started
    volumes:
      - ../../scripts/mock-upstream-threaded.py:/mock-upstream.py:ro
    environment:
      - MOCK_HOST=0.0.0.0
      - MOCK_PORT=18080
    command: ["python3", "/mock-upstream.py"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          pids: 512
          cpus: "1.00"
          memory: 512M

networks:
  bsdm-lite:
    driver: bridge

volumes:
  lite-spill:
    driver: local
  lite-indexer:
    driver: local
  lite-pinning-audit:
    driver: local
