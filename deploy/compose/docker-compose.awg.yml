# Pinned so the project name stays 'bsdm-proxy' now that this file lives
# outside the repo root (Compose would otherwise derive it from the directory).
name: bsdm-proxy

# AmneziaWG (AWG) sidecar profile for BSDM-Proxy.
# Runs an obfuscated AmneziaWG VPN server endpoint forwarding traffic to BSDM-Proxy.
#
# Usage:
#   docker compose -f deploy/compose/docker-compose.lite.yml -f deploy/compose/docker-compose.awg.yml up -d
#
# Docs: docs/ops-and-dev/configuration.md · docs/roadmap.md

services:
  proxy:
    environment:
      - AWG_CONFIG_PATH=/etc/amnezia/amneziawg/awg0.conf
      - AWG_SERVER_ENDPOINT=proxy.corp.internal:51820
    volumes:
      - awg-config:/etc/amnezia/amneziawg

  amneziawg:
    image: amneziavpn/amneziawg-go:3.1.20260814
    container_name: bsdm-amneziawg
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NET_ADMIN only: needed to create/configure the awg0 interface.
    #
    # SYS_MODULE is deliberately NOT granted — it lets the container load
    # arbitrary kernel modules, i.e. full host takeover from a third-party
    # image that terminates untrusted UDP on :51820.
    #
    # PREREQUISITE ON THE HOST: the kernel module must be loaded before `up`:
    #   sudo modprobe amneziawg           # or: sudo modprobe wireguard
    #   echo amneziawg | sudo tee /etc/modules-load.d/amneziawg.conf
    # (also ensure /dev/net/tun exists on the host: sudo modprobe tun)
    #
    # MKNOD is kept because the entrypoint of this image creates /dev/net/tun
    # itself when the device is not passed in; it is part of Docker's default
    # capability set, so this is not a privilege increase over the old config.
    cap_add:
      - NET_ADMIN
      - MKNOD
    ports:
      - "51820:51820/udp"
    environment:
      - AWG_INTERFACE=awg0
      - AWG_ADDRESS=10.8.0.1/24
      - AWG_LISTEN_PORT=51820
      - AWG_JC=4
      - AWG_JMIN=40
      - AWG_JMAX=70
      - AWG_S1=15
      - AWG_S2=25
      - AWG_H1=10000001
      - AWG_H2=10000002
      - AWG_H3=10000003
      - AWG_H4=10000004
      - PROXY_ENDPOINT=proxy:3128
    volumes:
      - awg-config:/etc/amnezia/amneziawg
    networks:
      - bsdm-lite
    restart: unless-stopped
    deploy:
      resources:
        limits:
          pids: 512
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 128M

volumes:
  awg-config:

