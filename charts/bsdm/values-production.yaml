# PRODUCTION (v1.0 GA) security baseline for charts/bsdm.
#
# GA components only: proxy + dns-sinkhole. cache-indexer, alert-worker,
# ml-worker and threat-intel stay disabled here (Beta/optional — deploy the
# analytics stack as a separate release with values-analytics.yaml).
#
# Sizing is NOT the point of this file; combine it with a sizing profile and
# put this file LAST so its security settings win:
#   helm upgrade --install bsdm charts/bsdm -n bsdm-proxy \
#     -f charts/bsdm/values-prod.yaml \        # optional: ~5k users sizing
#     -f charts/bsdm/values-production.yaml \
#     --set image.tag=<version>
#
# Secrets you must create first (names are referenced below; never inline):
#   kubectl -n bsdm-proxy create secret generic bsdm-control \
#     --from-literal=control-api-token="$(openssl rand -hex 32)"
#   kubectl -n bsdm-proxy create secret generic bsdm-metrics \
#     --from-literal=metrics-auth-token="$(openssl rand -hex 32)"
#   kubectl -n bsdm-proxy create secret generic bsdm-basic-auth \
#     --from-file=basic-auth-users.json=./basic-auth-users.json
#   kubectl -n bsdm-proxy create secret generic bsdm-mitm-ca \
#     --from-file=ca.crt=./certs/ca.crt --from-file=ca.key=./certs/ca.key
# The ServiceMonitor uses bsdm-metrics, so it must live in the release
# namespace and be readable by Prometheus Operator.
#
# The render FAILS if the control-plane token or the basic-auth users Secret is
# missing (requireSecret / requireUsersFile) — fail-closed instead of an
# operator reaching for CONTROL_API_ALLOW_INSECURE.

replicaCount: 3

image:
  repository: ghcr.io/onixus/bsdm-proxy
  # Pin the released version (override with --set image.tag=...). Enforce the
  # cosign signature at admission (Sigstore policy-controller / Kyverno
  # verifyImages) — see docs for the certificate identity.
  tag: "1.0.0-rc.1"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true

# Pod Security Standards "restricted" compliant (all workloads).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "4"
    memory: 8Gi

spill:
  enabled: true
  sizeLimit: 20Gi
  mountPath: /var/cache/bsdm-spill

mitm:
  enabled: true
  existingSecret: bsdm-mitm-ca
  certMountPath: /certs

acl:
  enabled: true
  # ConfigMap with acl-rules.json (mounted read-only; change via GitOps).
  existingConfigMap: ""
  defaultAction: allow
  autoReload: false

proxy:
  deploymentProfile: production
  policyMode: selective-mitm
  mitmEnabled: true
  authEnabled: true
  authBackend: basic
  # Production never runs an anonymous proxy.
  allowAnonymousProxy: false
  maxRequestBodyBytes: "67108864"
  aclEnabled: true
  controlApi:
    existingSecret: bsdm-control
    existingSecretKey: control-api-token
    requireSecret: true
  metricsAuth:
    existingSecret: bsdm-metrics
    existingSecretKey: metrics-auth-token
  basicAuth:
    existingSecret: bsdm-basic-auth
    existingSecretKey: basic-auth-users.json
    # Not under acl.mountPath: that ConfigMap mount is read-only, so a nested
    # mountpoint inside it could not be created.
    mountPath: /etc/bsdm-auth
    requireUsersFile: true
  blockLoopbackForwarding: true
  blockCloudMetadata: true
  allowedConnectPorts: "443,8443"
  disableLabFeatures: true
  # Never in production: serves cache hits before auth/ACL.
  perfFastCacheHit: false
  # L2 Redis / hierarchy / Kafka are not part of the GA baseline.
  redisL2Enabled: false
  hierarchyEnabled: false
  kafkaBrokers: ""
  kafkaSampleRate: 0
  categorizationEnabled: false
  urlhausEnabled: false
  phishtankEnabled: false
  rknSyncEnabled: false
  rustLog: "info,bsdm_proxy=info"
  shutdownTimeoutSeconds: 30
  extraEnv:
    # RKN_FALLBACK_URL deliberately unset (production: no third-party fallback).
    - name: TI_SHADOW_MATCH_ENABLED
      value: "false"
    - name: THREAT_SCORE_ENABLED
      value: "false"

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5
  startup:
    path: /health
    failureThreshold: 30
    periodSeconds: 5

lifecycle:
  preStopSleepSeconds: 15

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# With minReplicas 3, keeping 2 available allows one voluntary eviction at a
# time (node drains proceed, the proxy never drops below 2 pods).
pdb:
  enabled: true
  minAvailable: 2

# Spread replicas across nodes and zones so one node/zone loss does not take
# the whole forward proxy down.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bsdm
      - weight: 50
        podAffinityTerm:
          topologyKey: topology.kubernetes.io/zone
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bsdm

networkPolicy:
  enabled: true
  defaultDeny: true
  # REQUIRED: who may use the proxy (release-namespace pods are always allowed).
  proxyClientNamespaces: []
  #  - apps
  proxyIngressCidrs: []
  #  - 10.20.30.0/24      # office / VPN ranges, narrow
  monitoringNamespace: monitoring
  # Admin/bastion sources for the control plane (:9090). Keep minimal.
  controlPlaneNamespaces: []
  controlPlaneCidrs: []
  dnsSinkholeClientNamespaces: []
  dnsSinkholeClientCidrs: []
  allowEgressInternet: true
  redisNamespace: ""
  kafkaNamespace: ""

serviceMonitor:
  enabled: true
  interval: 30s

# --- GA sidecar: DNS sinkhole ----------------------------------------------
dnsSinkhole:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/onixus/bsdm-dns-sinkhole
    tag: "1.0.0-rc.1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: 64Mi
    limits:
      cpu: "500m"
      memory: 256Mi
  unprivilegedPortStart: 53

# --- Not GA: keep off in the production baseline -----------------------------
indexer:
  enabled: false
alertWorker:
  enabled: false
mlWorker:
  enabled: false
threatIntel:
  enabled: false
  enforcementMode: shadow
