{{- if and (gt (int .Values.replicaCount) 0) .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "bsdm.fullname" . }}
  labels:
    {{- include "bsdm.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "bsdm.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      {{- with .Values.proxy.metricsAuth.existingSecret }}
      # /metrics requires METRICS_AUTH_TOKEN when proxy.metricsAuth is set.
      authorization:
        type: Bearer
        credentials:
          name: {{ . }}
          key: {{ $.Values.proxy.metricsAuth.existingSecretKey | default "metrics-auth-token" }}
      {{- end }}
{{- end }}
