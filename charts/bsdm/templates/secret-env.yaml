{{- /*
Credentials that used to sit in the env ConfigMap. Only rendered when the
operator supplies the value inline *and* has not pointed the chart at an
existing Secret; proxy.phishtankExistingSecret always wins.
*/ -}}
{{- if and (gt (int .Values.replicaCount) 0) (not .Values.proxy.phishtankExistingSecret) .Values.proxy.phishtankApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bsdm.fullname" . }}-secrets
  labels:
    {{- include "bsdm.labels" . | nindent 4 }}
type: Opaque
stringData:
  phishtank-api-key: {{ .Values.proxy.phishtankApiKey | quote }}
{{- end }}
