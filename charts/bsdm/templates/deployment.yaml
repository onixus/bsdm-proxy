{{- if gt (int .Values.replicaCount) 0 }}
{{- if and .Values.proxy.controlApi.requireSecret (not .Values.proxy.controlApi.existingSecret) }}
{{- fail "proxy.controlApi.requireSecret=true: set proxy.controlApi.existingSecret to a Secret holding the control-plane token (key proxy.controlApi.existingSecretKey). Do not use CONTROL_API_ALLOW_INSECURE in production." }}
{{- end }}
{{- if and .Values.proxy.basicAuth.requireUsersFile .Values.proxy.authEnabled (eq (.Values.proxy.authBackend | default "basic") "basic") (not .Values.proxy.basicAuth.existingSecret) }}
{{- fail "proxy.basicAuth.requireUsersFile=true: authEnabled with the basic backend needs proxy.basicAuth.existingSecret (a Secret with the users JSON); without it any credentials would be accepted." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bsdm.fullname" . }}
  labels:
    {{- include "bsdm.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "bsdm.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret-env.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "bsdm.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "bsdm.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "bsdm.podSecurityContext" (dict "ctx" . "component" .Values.proxy) | nindent 8 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ add .Values.proxy.shutdownTimeoutSeconds .Values.lifecycle.preStopSleepSeconds }}
      containers:
        - name: proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "bsdm.containerSecurityContext" (dict "ctx" . "component" .Values.proxy) | nindent 12 }}
          ports:
            - name: proxy
              containerPort: {{ .Values.service.proxyPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "bsdm.fullname" . }}-env
          {{- $phishtankSecret := "" }}
          {{- $phishtankKey := "" }}
          {{- if .Values.proxy.phishtankExistingSecret }}
          {{- $phishtankSecret = .Values.proxy.phishtankExistingSecret }}
          {{- $phishtankKey = .Values.proxy.phishtankExistingSecretKey | default "phishtank-api-key" }}
          {{- else if .Values.proxy.phishtankApiKey }}
          {{- $phishtankSecret = printf "%s-secrets" (include "bsdm.fullname" .) }}
          {{- $phishtankKey = "phishtank-api-key" }}
          {{- end }}
          {{- if or $phishtankSecret .Values.proxy.extraEnv .Values.proxy.controlApi.existingSecret .Values.proxy.metricsAuth.existingSecret .Values.proxy.searchUpstream.existingSecret }}
          env:
            {{- with .Values.proxy.searchUpstream.existingSecret }}
            - name: SEARCH_UPSTREAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.proxy.searchUpstream.existingSecretKey | default "search-api-token" }}
            {{- end }}
            {{- with .Values.proxy.controlApi.existingSecret }}
            - name: CONTROL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.proxy.controlApi.existingSecretKey | default "control-api-token" }}
            {{- end }}
            {{- with .Values.proxy.metricsAuth.existingSecret }}
            - name: METRICS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.proxy.metricsAuth.existingSecretKey | default "metrics-auth-token" }}
            {{- end }}
            {{- if $phishtankSecret }}
            # Credential: secretKeyRef, not the env ConfigMap (a ConfigMap is
            # readable by anything with namespace get/list and lands in etcd
            # unencrypted regardless of encryption-at-rest for Secrets).
            - name: PHISHTANK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $phishtankSecret }}
                  key: {{ $phishtankKey }}
            {{- end }}
            {{- with .Values.proxy.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          volumeMounts:
            # read-only rootfs: give the process a small private /tmp.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.proxy.basicAuth.existingSecret }}
            - name: basic-auth
              mountPath: {{ .Values.proxy.basicAuth.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.spill.enabled }}
            - name: spill
              mountPath: {{ .Values.spill.mountPath }}
            {{- end }}
            {{- if and .Values.mitm.enabled .Values.mitm.existingSecret }}
            - name: mitm-certs
              mountPath: {{ .Values.mitm.certMountPath }}
              readOnly: true
            {{- end }}
            {{- if and .Values.acl.enabled .Values.acl.existingConfigMap }}
            - name: acl-rules
              mountPath: {{ .Values.acl.mountPath }}
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: metrics
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: metrics
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: metrics
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep {{ .Values.lifecycle.preStopSleepSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.proxy.basicAuth.existingSecret }}
        - name: basic-auth
          secret:
            secretName: {{ .Values.proxy.basicAuth.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.proxy.basicAuth.existingSecretKey }}
                path: {{ .Values.proxy.basicAuth.existingSecretKey }}
        {{- end }}
        {{- if .Values.spill.enabled }}
        - name: spill
          emptyDir:
            sizeLimit: {{ .Values.spill.sizeLimit }}
        {{- end }}
        {{- if and .Values.mitm.enabled .Values.mitm.existingSecret }}
        - name: mitm-certs
          secret:
            secretName: {{ .Values.mitm.existingSecret }}
            defaultMode: 0440
        {{- end }}
        {{- if and .Values.acl.enabled .Values.acl.existingConfigMap }}
        - name: acl-rules
          configMap:
            name: {{ .Values.acl.existingConfigMap }}
        {{- end }}
{{- end }}
