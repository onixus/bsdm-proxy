{{- /*
Search API bearer token, moved out of the indexer env ConfigMap. Only rendered
when the token is given inline and no existing Secret is referenced;
indexer.searchApi.existingSecret always wins.
*/ -}}
{{- if and .Values.indexer .Values.indexer.enabled (not .Values.indexer.searchApi.existingSecret) .Values.indexer.searchApi.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bsdm.fullname" . }}-indexer-secrets
  labels:
    {{- include "bsdm.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache-indexer
type: Opaque
stringData:
  search-api-token: {{ .Values.indexer.searchApi.token | quote }}
{{- end }}
