{{- if and .Values.threatIntel .Values.threatIntel.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bsdm.fullname" . }}-threat-intel
  labels:
    {{- include "bsdm.labels" . | nindent 4 }}
    app.kubernetes.io/component: threat-intel
spec:
  replicas: {{ .Values.threatIntel.replicaCount }}
  selector:
    matchLabels:
      {{- include "bsdm.threatIntelSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bsdm.threatIntelSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "bsdm.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "bsdm.podSecurityContext" (dict "ctx" . "component" .Values.threatIntel) | nindent 8 }}
      containers:
        - name: threat-intel
          image: "{{ .Values.threatIntel.image.repository }}:{{ .Values.threatIntel.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.threatIntel.image.pullPolicy }}
          securityContext:
            {{- include "bsdm.containerSecurityContext" (dict "ctx" . "component" .Values.threatIntel) | nindent 12 }}
          ports:
            - name: admin
              containerPort: {{ .Values.threatIntel.service.port }}
              protocol: TCP
          env:
            - name: TI_SOURCES
              value: {{ .Values.threatIntel.sources | quote }}
            - name: TI_POLL_INTERVAL_SECS
              value: {{ .Values.threatIntel.pollIntervalSecs | quote }}
            - name: TI_HTTP_TIMEOUT_SECS
              value: {{ .Values.threatIntel.httpTimeoutSecs | quote }}
            - name: TI_MAX_ATTEMPTS
              value: {{ .Values.threatIntel.maxAttempts | quote }}
            - name: TI_OUTPUT_DIR
              value: {{ .Values.threatIntel.outputDir | quote }}
            - name: TI_ENFORCEMENT_MODE
              value: {{ .Values.threatIntel.enforcementMode | default "shadow" | quote }}
            # Pod-network bind for probes and scraping; SOAR mutations still
            # require TI_API_TOKEN (fail-closed without it).
            - name: TI_ADMIN_BIND
              value: {{ .Values.threatIntel.adminBind | default "0.0.0.0" | quote }}
            {{- if .Values.threatIntel.apiToken }}
            {{- fail "threatIntel.apiToken is no longer supported: an inline SOAR token is rendered into the Deployment spec, visible to anyone with `get deployments` and stored in whatever holds your values file. Create a Secret (kubectl create secret generic bsdm-ti --from-literal=ti-api-token=<token>), set threatIntel.existingSecret=bsdm-ti (and threatIntel.existingSecretKey if the key differs) and clear threatIntel.apiToken. Leaving all three empty is also fine: the mutating /api/v1/soar/* endpoints stay fail-closed." }}
            {{- end }}
            {{- if .Values.threatIntel.existingSecret }}
            - name: TI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.threatIntel.existingSecret }}
                  key: {{ .Values.threatIntel.existingSecretKey | default "ti-api-token" }}
            {{- end }}
            - name: TI_SOAR_AUDIT_PATH
              value: {{ printf "%s/soar-audit.jsonl" .Values.threatIntel.outputDir | quote }}
            - name: METRICS_PORT
              value: {{ .Values.threatIntel.service.port | quote }}
            - name: RUST_LOG
              value: {{ .Values.threatIntel.rustLog | quote }}
          volumeMounts:
            - name: snapshots
              mountPath: {{ .Values.threatIntel.outputDir }}
          livenessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.threatIntel.resources | nindent 12 }}
      volumes:
        - name: snapshots
        {{- if .Values.threatIntel.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "bsdm.fullname" . }}-threat-intel
        {{- else }}
          emptyDir:
            # Uncapped emptyDir is node ephemeral storage: a feed that suddenly
            # returns gigabytes fills the node and evicts co-located pods.
            sizeLimit: {{ .Values.threatIntel.emptyDirSizeLimit | default "1Gi" }}
        {{- end }}
{{- end }}
