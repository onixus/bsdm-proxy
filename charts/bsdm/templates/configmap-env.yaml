{{- if gt (int .Values.replicaCount) 0 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bsdm.fullname" . }}-env
  labels:
    {{- include "bsdm.labels" . | nindent 4 }}
data:
  HTTP_PORT: {{ .Values.service.proxyPort | quote }}
  METRICS_PORT: {{ .Values.service.metricsPort | quote }}
  DEPLOYMENT_PROFILE: {{ .Values.proxy.deploymentProfile | quote }}
  POLICY_MODE: {{ .Values.proxy.policyMode | quote }}
  WORKER_COUNT: {{ .Values.proxy.workerCount | quote }}
  CACHE_CAPACITY: {{ .Values.proxy.cacheCapacity | quote }}
  CACHE_SHARDS: {{ .Values.proxy.cacheShards | quote }}
  CACHE_TTL_SECONDS: {{ .Values.proxy.cacheTtlSeconds | quote }}
  MAX_CACHE_BODY_SIZE: {{ .Values.proxy.maxCacheBodySize | quote }}
  CACHE_SPILL_THRESHOLD_BYTES: {{ .Values.proxy.spillThresholdBytes | quote }}
  CACHE_SPILL_DIR: {{ .Values.spill.mountPath | quote }}
  REDIS_L2_ENABLED: {{ .Values.proxy.redisL2Enabled | quote }}
  REDIS_URL: {{ .Values.proxy.redisUrl | quote }}
  REDIS_KEY_PREFIX: {{ .Values.proxy.redisKeyPrefix | quote }}
  KAFKA_TOPIC: {{ .Values.proxy.kafkaTopic | quote }}
  KAFKA_SAMPLE_RATE: {{ .Values.proxy.kafkaSampleRate | quote }}
  METRICS_SAMPLE_RATE: {{ .Values.proxy.metricsSampleRate | quote }}
  PERF_FAST_CACHE_HIT: {{ .Values.proxy.perfFastCacheHit | quote }}
  MITM_ENABLED: {{ .Values.proxy.mitmEnabled | quote }}
  {{- if and .Values.mitm.enabled .Values.mitm.existingSecret }}
  # Explicit: the Secret is mounted at certMountPath; do not rely on the
  # deprecated /certs fallback lookup.
  MITM_CA_DIR: {{ .Values.mitm.certMountPath | quote }}
  {{- end }}
  AUTH_ENABLED: {{ .Values.proxy.authEnabled | quote }}
  AUTH_BACKEND: {{ .Values.proxy.authBackend | default "basic" | quote }}
  ALLOW_ANONYMOUS_PROXY: {{ .Values.proxy.allowAnonymousProxy | default false | quote }}
  {{- with .Values.proxy.maxRequestBodyBytes }}
  MAX_REQUEST_BODY_BYTES: {{ . | quote }}
  {{- end }}
  {{- with .Values.proxy.searchUpstream.url }}
  SEARCH_UPSTREAM_URL: {{ . | quote }}
  {{- end }}
  {{- if .Values.proxy.basicAuth.existingSecret }}
  BASIC_AUTH_USERS_FILE: {{ printf "%s/%s" .Values.proxy.basicAuth.mountPath .Values.proxy.basicAuth.existingSecretKey | quote }}
  {{- end }}
  {{- if .Values.proxy.metricsAuth.existingSecret }}
  METRICS_REQUIRE_AUTH: "true"
  {{- end }}
  BLOCK_LOOPBACK_FORWARDING: {{ .Values.proxy.blockLoopbackForwarding | quote }}
  BLOCK_CLOUD_METADATA: {{ .Values.proxy.blockCloudMetadata | quote }}
  {{- if .Values.proxy.allowedConnectPorts }}
  ALLOWED_CONNECT_PORTS: {{ .Values.proxy.allowedConnectPorts | quote }}
  {{- end }}
  {{- if .Values.proxy.disableLabFeatures }}
  # Lab / Beta / frozen features — explicitly off (proxy.disableLabFeatures).
  EBPF_XDP_ENABLED: "false"
  EBPF_XDP_ALLOW_RUNTIME_ENABLE: "false"
  WASM_ENABLED: "false"
  WASM_FAIL_OPEN: "false"
  ICAP_ENABLED: "false"
  DLP_ENABLED: "false"
  CONTROL_GRPC_ENABLED: "false"
  ICP_SERVER_ENABLED: "false"
  HTCP_SERVER_ENABLED: "false"
  PEER_DISCOVERY_ENABLED: "false"
  SEMANTIC_CACHE_ENABLED: "false"
  THREAT_SCORE_BLOCK_THRESHOLD: "0"
  TI_ENFORCEMENT_MODE: "shadow"
  TI_ENFORCE_ENABLED: "false"
  TI_ENFORCEMENT_ENABLED: "false"
  AGENT_API_ENABLED: "false"
  AWG_API_ENABLED: "false"
  LAB_API_ENABLED: "false"
  {{- end }}
  ACL_ENABLED: {{ .Values.proxy.aclEnabled | quote }}
  ACL_DEFAULT_ACTION: {{ .Values.acl.defaultAction | quote }}
  ACL_RULES_PATH: {{ printf "%s/acl-rules.json" .Values.acl.mountPath | quote }}
  ACL_AUTO_RELOAD: {{ .Values.acl.autoReload | quote }}
  ACL_RELOAD_INTERVAL: {{ .Values.acl.reloadInterval | quote }}
  CATEGORIZATION_ENABLED: {{ .Values.proxy.categorizationEnabled | quote }}
  HIERARCHY_ENABLED: {{ .Values.proxy.hierarchyEnabled | quote }}
  # Categorization sources
  URLHAUS_ENABLED: {{ .Values.proxy.urlhausEnabled | quote }}
  PHISHTANK_ENABLED: {{ .Values.proxy.phishtankEnabled | quote }}
  # PHISHTANK_API_KEY is deliberately absent here — it is injected as a
  # secretKeyRef in deployment.yaml (see secret-env.yaml).
  CUSTOM_DB_ENABLED: {{ .Values.proxy.customDbEnabled | quote }}
  {{- if .Values.proxy.customDbPath }}
  CUSTOM_DB_PATH: {{ .Values.proxy.customDbPath | quote }}
  {{- end }}
  # RKN category sync
  RKN_SYNC_ENABLED: {{ .Values.proxy.rknSyncEnabled | quote }}
  RKN_SYNC_URL: {{ .Values.proxy.rknSyncUrl | quote }}
  RKN_SYNC_INTERVAL_SECS: {{ .Values.proxy.rknSyncIntervalSecs | quote }}
  RUST_LOG: {{ .Values.proxy.rustLog | quote }}
  SHUTDOWN_TIMEOUT_SECONDS: {{ .Values.proxy.shutdownTimeoutSeconds | quote }}
  {{- if .Values.proxy.kafkaBrokers }}
  KAFKA_BROKERS: {{ .Values.proxy.kafkaBrokers | quote }}
  {{- end }}
{{- end }}
