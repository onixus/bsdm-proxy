{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bsdm.serviceAccountName" . }}
  labels:
    {{- include "bsdm.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No component talks to the Kubernetes API and the chart ships no Role/
# RoleBinding, so the projected token is pure attack surface — a shell in the
# MITM proxy pod would otherwise start with cluster credentials.
automountServiceAccountToken: false
{{- end }}
