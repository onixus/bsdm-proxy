# Default values for bsdm-proxy on Kubernetes.
# See docs/ops-and-dev/k8s-architecture.md and values-prod.yaml.

replicaCount: 2

image:
  repository: ghcr.io/onixus/bsdm-proxy
  tag: "0.6.1-1"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  proxyPort: 3128
  metricsPort: 9090
  sessionAffinity: None

serviceAccount:
  create: true
  annotations: {}
  # Required when create=false: the chart refuses to fall back to the
  # namespace "default" ServiceAccount.
  name: ""

podAnnotations: {}
podLabels: {}

# Applied to all six workloads (proxy, indexer, alert-worker, ml-worker,
# threat-intel, dns-sinkhole). seccompProfile is what makes the chart pass
# Pod Security Standards "restricted"; do not drop it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Default container securityContext. Each component may override it with
# <component>.securityContext (see indexer.securityContext below) so that a
# relaxation for one workload does not weaken the other five.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "4"
    memory: 8Gi

# emptyDir for mmap spill — do not use shared RWX PVC
spill:
  enabled: true
  sizeLimit: 20Gi
  mountPath: /var/cache/bsdm-spill

mitm:
  enabled: true
  existingSecret: ""          # mounted 0440 (root:fsGroup); never world-readable
  certMountPath: /certs

acl:
  enabled: false
  existingConfigMap: ""       # if set, mount acl-rules.json
  mountPath: /etc/bsdm-proxy
  defaultAction: allow
  autoReload: false
  reloadInterval: 60          # seconds between hot-reload checks

# Proxy environment — maps to packaging/config/bsdm-proxy.env.example
proxy:
  deploymentProfile: production
  policyMode: selective-mitm
  workerCount: 1
  cacheCapacity: 10000
  cacheShards: 16
  cacheTtlSeconds: 3600
  maxCacheBodySize: 10485760
  spillThresholdBytes: 262144
  redisL2Enabled: false
  redisUrl: "redis://redis-master:6379"
  redisKeyPrefix: "bsdm:http:"
  kafkaBrokers: ""
  kafkaTopic: cache-events
  kafkaSampleRate: 10
  metricsSampleRate: 100
  perfFastCacheHit: false
  mitmEnabled: true
  authEnabled: false
  aclEnabled: false
  categorizationEnabled: false
  hierarchyEnabled: false
  # Categorization sources
  urlhausEnabled: false
  phishtankEnabled: false
  # PhishTank API key is a credential: it is injected via secretKeyRef, never
  # via the env ConfigMap. Prefer an existing Secret:
  #   kubectl create secret generic bsdm-phishtank --from-literal=phishtank-api-key=...
  # If phishtankExistingSecret is empty and phishtankApiKey is set, the chart
  # creates the Secret itself (the value then lives in your values file).
  phishtankExistingSecret: ""
  phishtankExistingSecretKey: "phishtank-api-key"
  phishtankApiKey: ""
  customDbEnabled: false
  customDbPath: ""
  # RKN category sync (daily by default)
  rknSyncEnabled: false
  rknSyncUrl: "https://svn.code.sf.net/p/zapret-info/code/dump.csv"
  rknSyncIntervalSecs: 86400
  rustLog: "info,bsdm_proxy=info"
  shutdownTimeoutSeconds: 30
  extraEnv: []

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5
  startup:
    path: /health
    failureThreshold: 30
    periodSeconds: 5

lifecycle:
  preStopSleepSeconds: 15

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  # Enabled by default: every chart workload is covered by an explicit policy
  # and by a default-deny that selects this release's pods. Requires a CNI that
  # enforces NetworkPolicy (Calico/Cilium/Antrea); on a CNI that ignores them
  # this is a no-op, not a breakage.
  enabled: true
  # BREAKING vs <=0.6.1: the previous default was `10.0.0.0/8`, which also
  # covered the pod CIDR (i.e. every pod in the cluster could open the proxy
  # port). Pods in the release namespace are always allowed; list additional
  # client namespaces and *narrow* external/on-prem CIDRs here.
  proxyIngressCidrs: []
  # Namespaces (by kubernetes.io/metadata.name) whose pods may use the proxy.
  proxyClientNamespaces: []
  # Namespace allowed to scrape metrics (all components).
  monitoringNamespace: "monitoring"
  # Namespaces allowed to call the threat-intel admin/SOAR API on :8093.
  threatIntelAdminNamespaces: []
  # Consumers of the cache-indexer Search API (:8080). Same shape as above.
  searchApiNamespaces: []
  searchApiCidrs: []
  # Clients of the DNS sinkhole (:53/UDP). Release-namespace pods are always
  # allowed so the proxy can resolve through it.
  dnsSinkholeClientNamespaces: []
  dnsSinkholeClientCidrs: []
  allowEgressInternet: true
  redisNamespace: ""
  kafkaNamespace: ""
  # Namespace hosting ClickHouse. When empty, egress to the ClickHouse port is
  # allowed to any destination (port-restricted only) so that managed/external
  # ClickHouse keeps working; set it to lock egress down to one namespace.
  clickhouseNamespace: ""
  clickhousePort: 8123
  # Cluster DNS. Egress to :53 is restricted to these pods instead of being
  # open to the whole world (DNS tunnelling / exfiltration path).
  dnsNamespace: "kube-system"
  dnsPodSelector:
    k8s-app: kube-dns
  # Upstream resolvers the dns-sinkhole forwards to (DNS_SINKHOLE_UPSTREAM,
  # default 1.1.1.1:53). Public resolvers only — private ranges are excluded.
  dnsSinkholeUpstreamCidrs:
    - 0.0.0.0/0
  # Deny-all baseline for this release's pods. Scoped by
  # app.kubernetes.io/instance so it cannot cut off co-located third-party
  # workloads (Redis, ClickHouse) living in the same namespace.
  defaultDeny: true
  # Stricter variant: deny-all for *every* pod in the namespace. Only enable
  # when the namespace holds nothing but this release.
  defaultDenyNamespace: false

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# Optional cache-indexer (Kafka → ClickHouse). Prefer a separate release in
# bsdm-analytics with values-analytics.yaml, or enable alongside proxy.
indexer:
  enabled: false
  replicaCount: 2
  image:
    repository: ghcr.io/onixus/bsdm-cache-indexer
    tag: "0.6.1-1"
    pullPolicy: IfNotPresent
  # Per-workload override; falls back to the chart-wide .securityContext.
  # securityContext:
  #   allowPrivilegeEscalation: false
  #   readOnlyRootFilesystem: true
  #   capabilities:
  #     drop: [ALL]
  resources:
    requests:
      cpu: "250m"
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  service:
    port: 8080
  kafka:
    brokers: "kafka-bootstrap.bsdm-analytics.svc:9092"
    topic: cache-events
    groupId: cache-indexer-group
  clickhouse:
    url: "http://clickhouse-bsdm.bsdm-analytics.svc.cluster.local:8123"
    database: bsdm
    table: http_cache
    # Credentials come from a Secret with keys username / password:
    #   kubectl create secret generic bsdm-clickhouse \
    #     --from-literal=username=bsdm --from-literal=password=...
    existingSecret: ""
    # Non-secret username for an unauthenticated/anonymous ClickHouse. Setting
    # it without existingSecret is a hard error (see indexer-deployment.yaml).
    user: ""
    # REMOVED: an inline password rendered straight into the Deployment spec.
    # Setting it now fails the render — use existingSecret.
    password: ""
  searchApi:
    enabled: true
    # Search API bearer token. Injected via secretKeyRef, never via ConfigMap.
    #   kubectl create secret generic bsdm-search --from-literal=search-api-token=...
    existingSecret: ""
    existingSecretKey: "search-api-token"
    # If existingSecret is empty and token is set, the chart creates the Secret.
    token: ""
    maxLimit: 10000
    defaultDays: 30
  rustLog: "info,cache_indexer=info"

# Optional alert-worker (ClickHouse → webhook / SIEM)
alertWorker:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/onixus/bsdm-alert-worker
    tag: "0.6.1-1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: 128Mi
    limits:
      cpu: "500m"
      memory: 512Mi
  service:
    port: 8090
  clickhouseUrl: "http://clickhouse-bsdm.bsdm-analytics.svc.cluster.local:8123"
  webhookUrl: ""
  pollIntervalSecs: 60
  rustLog: "info,alert_worker=info"

# Optional ml-worker (ClickHouse features + scores)
mlWorker:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/onixus/bsdm-ml-worker
    tag: "0.6.1-1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "250m"
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  service:
    port: 8091
  clickhouseUrl: "http://clickhouse-bsdm.bsdm-analytics.svc.cluster.local:8123"
  rustLog: "info,ml_worker=info"

# Optional threat-intel collector (IOC feed ingestion)
threatIntel:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/onixus/bsdm-threat-intel
    tag: "0.6.1-1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "50m"
      memory: 64Mi
    limits:
      cpu: "500m"
      memory: 512Mi
  service:
    port: 8093
  sources: "openphish,phishstats,phishing_database,urlhaus"
  pollIntervalSecs: 900
  httpTimeoutSecs: 30
  maxAttempts: 3
  outputDir: /var/lib/bsdm-proxy/threat-intel
  # shadow (default, observe-only) or enforce. Shadow writes <artifact>.shadow
  # files that dns-sinkhole and the proxy never load (issue #330).
  enforcementMode: shadow
  # Admin/SOAR API bind inside the pod. Mutating /api/v1/soar/* endpoints are
  # fail-closed until apiToken is set (Bearer TI_API_TOKEN).
  adminBind: "0.0.0.0"
  # SOAR token. Must come from a Secret:
  #   kubectl create secret generic bsdm-ti --from-literal=ti-api-token=...
  existingSecret: ""
  existingSecretKey: "ti-api-token"
  # REMOVED: an inline token rendered straight into the Deployment spec.
  # Setting it now fails the render — use existingSecret. Leaving both empty is
  # supported and keeps the mutating SOAR endpoints fail-closed.
  apiToken: ""
  # emptyDir cap for the snapshot volume when persistence is disabled; without
  # it a runaway feed fills the node's ephemeral storage and evicts neighbours.
  emptyDirSizeLimit: 1Gi
  # Snapshots are rebuilt on every cycle, so an emptyDir is enough unless the
  # IOC store (TASK-TI-002) needs them to survive a restart.
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
  rustLog: "info,threat_intel=info"

# Optional DNS sinkhole sidecar (RPZ-lite UDP proxy)
dnsSinkhole:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/onixus/bsdm-dns-sinkhole
    tag: "0.6.1-1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "50m"
      memory: 64Mi
    limits:
      cpu: "200m"
      memory: 256Mi
  service:
    dnsPort: 53
    metricsPort: 8092
  zonePath: /etc/bsdm-proxy/blocklist.rpz
  bind: "0.0.0.0:53"
  existingConfigMap: ""       # mount custom RPZ zone file
  rustLog: "info,dns_sinkhole=info"

nodeSelector: {}
tolerations: []
affinity: {}
