[package]
name = "agent-spike"
version = "0.1.0"
edition = "2021"
description = "BSDM Local Policy Agent (product binary bsdm-agent; lab alias agent-spike)"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
bsdm-events = { workspace = true }
rcgen = { version = "0.14", default-features = true, features = ["pem"] }
tokio-tungstenite = { version = "0.30", default-features = true, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http = "1"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

# Both binaries are auto-discovered from src/bin/ and are thin wrappers over
# this package's library. They previously shared a single src/main.rs via two
# explicit [[bin]] targets, which cargo warns about ("found to be present in
# multiple build targets") and which broke cold builds with E0463: the two
# targets compile the same source concurrently. Keep one file per binary.
[lib]
name = "agent_spike"
path = "src/lib.rs"

