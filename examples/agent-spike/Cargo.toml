[package]
name = "agent-spike"
version = "0.1.0"
edition = "2021"
description = "Minimal On-Device SWG Local Policy Agent Spike (Phase C, Issue #258)"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
bsdm-events = { workspace = true }
rcgen = { version = "0.14", default-features = true, features = ["pem"] }
tokio-tungstenite = { version = "0.30", default-features = true, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http = "1"
